<!doctype html>
<meta charset="utf-8">
<title>mitiru_preloader.js tests</title>
<!--
    test_preloader.html — mitiru.preloader (NF-04) unit test

    走らせ方:
      python tools/mitiru_serve.py --port 8770 --no-inject
      open http://localhost:8770/web/mitiru_runtime/tests/test_preloader.html

    機械可読な結果:
      window.__testResult  = { pass, fail, tests: [...] }
      window.__testDone    = true
-->
<link rel="stylesheet" href="../mitiru_base.css">
<style>
    body { padding: 16px; font-family: var(--mitiru-font-mono, monospace); }
    pre  { white-space: pre-wrap; }
</style>
<script src="../mitiru_runtime.js"></script>
<script src="../mitiru_test_harness.js"></script>
<script src="../mitiru_preloader.js"></script>
<pre id="results">(running...)</pre>
<script>
(function()
{
	'use strict';

	const t = mitiru.test;
	const p = mitiru.preloader;

	// 極小 1x1 透過 PNG (data URL — ネットワーク不要)
	var DATA_PNG = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';

	// 失敗テスト用の 404 path
	var PATH_404 = '/nonexistent-test-fixture-404.json';

	// Helper: テスト間で preloader の state をリセット
	function reset()
	{
		p.clear();
		p.unmount();
	}

	// ── 1. register() は item を追加する ──────────────────────────────
	t.case('register_appends_items_to_registry', function()
	{
		// 準備
		reset();

		// 実行
		p.register([{ kind: 'text', path: 'a.txt', key: 'a' }]);

		// 検証: progress().total は登録数を反映する
		t.assertEq(p.progress().total, 0, 'total is 0 before start (not yet counted)');
		// _items は直接読めないが、register + clear で追加されたことを確認できる
		p.register([{ kind: 'text', path: 'b.txt', key: 'b' }]);
		// clear 後は total がリセット。clear 前は両方存在 — 下の start で検証
		reset();
	});

	// ── 2. register() を 2 回呼ぶと連結する ───────────────────
	t.case('register_twice_concatenates_items', async function()
	{
		// 準備
		reset();
		var stub = _makeFetchStub({ 'a.txt': 'hello', 'b.txt': 'world' });
		var origFetch = mitiru.fetch;
		mitiru.fetch = stub;

		// 実行
		p.register([{ kind: 'text', path: 'a.txt', key: 'a' }]);
		p.register([{ kind: 'text', path: 'b.txt', key: 'b' }]);
		var result = await p.start();

		// 検証
		t.assertEq(result.loaded.length, 2, 'both items loaded');
		t.assert(result.loaded.indexOf('a') >= 0, 'key a loaded');
		t.assert(result.loaded.indexOf('b') >= 0, 'key b loaded');

		mitiru.fetch = origFetch;
		reset();
	});

	// ── 3. clear() は item と resolved map を破棄 ──────────────────
	t.case('clear_drops_items_and_resolved_map', async function()
	{
		// 準備
		reset();
		var stub = _makeFetchStub({ 'x.txt': 'content' });
		var origFetch = mitiru.fetch;
		mitiru.fetch = stub;

		p.register([{ kind: 'text', path: 'x.txt', key: 'x' }]);
		await p.start();
		t.assertEq(p.get('x'), 'content', 'x is in resolved map before clear');

		// 実行
		p.clear();

		// 検証
		t.assertEq(p.get('x'), undefined, 'x is gone from resolved map after clear');
		t.assertEq(p.progress().total, 0, 'total reset to 0 after clear');

		mitiru.fetch = origFetch;
	});

	// ── 4. mount() は期待通りの DOM を構築 ───────────────────────────
	t.case('mount_builds_expected_DOM_structure', function()
	{
		// 準備
		reset();
		var container = document.createElement('div');

		// 実行
		p.mount(container);

		// 検証
		var root = container.querySelector('[data-mitiru-preloader]');
		t.assert(root !== null, 'root element with data-mitiru-preloader exists');
		t.assert(root.classList.contains('mitiru-preloader'), 'root has mitiru-preloader class');

		var track = root.querySelector('.mitiru-preloader__track');
		t.assert(track !== null, 'track element exists');

		var fill = root.querySelector('.mitiru-preloader__fill');
		t.assert(fill !== null, 'fill element exists');
		t.assertEq(fill.style.width, '0%', 'fill starts at 0%');

		var label = root.querySelector('[data-preloader-label]');
		t.assert(label !== null, 'label element with data-preloader-label exists');
		t.assert(label.classList.contains('mitiru-preloader__label'), 'label has correct class');

		reset();
	});

	// ── 5. unmount() は DOM から取り除く ────────────────────────────
	t.case('unmount_removes_preloader_from_DOM', function()
	{
		// 準備
		reset();
		var container = document.createElement('div');
		document.body.appendChild(container);
		p.mount(container);
		t.assert(container.querySelector('[data-mitiru-preloader]') !== null, 'mounted');

		// 実行
		p.unmount();

		// 検証
		t.assertEq(container.querySelector('[data-mitiru-preloader]'), null, 'removed after unmount');

		document.body.removeChild(container);
		reset();
	});

	// ── 6. unmount() 後の mount() は再構築する ──────────────────────
	t.case('mount_after_unmount_rebuilds_DOM', function()
	{
		// 準備
		reset();
		var container = document.createElement('div');
		p.mount(container);
		p.unmount();

		// 実行
		p.mount(container);

		// 検証
		t.assert(container.querySelector('[data-mitiru-preloader]') !== null, 'rebuilt after re-mount');

		reset();
	});

	// ── 7. 空の registry での start() は即座に resolve ───────
	t.case('start_empty_registry_resolves_immediately', async function()
	{
		// 準備
		reset();

		// 実行
		var result = await p.start();

		// 検証
		t.assertEq(result.loaded.length, 0, 'no loaded keys');
		t.assertEq(result.failed.length, 0, 'no failed keys');
	});

	// ── 8. start() が text item を読み込み、get(key) が text を返す ──────
	t.case('start_loads_text_item_get_returns_text', async function()
	{
		// 準備
		reset();
		var stub = _makeFetchStub({ 'notes.txt': 'hello world' });
		var origFetch = mitiru.fetch;
		mitiru.fetch = stub;

		p.register([{ kind: 'text', path: 'notes.txt', key: 'notes' }]);

		// 実行
		await p.start();

		// 検証
		t.assertEq(p.get('notes'), 'hello world', 'get(notes) returns text content');

		mitiru.fetch = origFetch;
		reset();
	});

	// ── 9. start() が json item を読み込み、get(key) が object を返す ────
	t.case('start_loads_json_item_get_returns_parsed_object', async function()
	{
		// 準備
		reset();
		var payload = { version: 1, items: ['a', 'b'] };
		var stub = _makeFetchStub({ 'data.json': JSON.stringify(payload) }, 'json');
		var origFetch = mitiru.fetch;
		mitiru.fetch = stub;

		p.register([{ kind: 'json', path: 'data.json', key: 'data' }]);

		// 実行
		await p.start();

		// 検証
		var got = p.get('data');
		t.assert(got !== null && typeof got === 'object', 'get(data) is an object');
		t.assertEq(got.version, 1, 'parsed version field correct');
		t.assertEq(got.items[0], 'a', 'parsed items[0] correct');

		mitiru.fetch = origFetch;
		reset();
	});

	// ── 10. start() が image を読み込み、get(key) が HTMLImageElement ─
	t.case('start_loads_image_item_get_returns_HTMLImageElement', async function()
	{
		// 準備
		reset();
		p.register([{ kind: 'image', path: DATA_PNG, key: 'bg' }]);

		// 実行
		await p.start();

		// 検証
		var img = p.get('bg');
		t.assert(img instanceof window.HTMLImageElement, 'get(bg) is HTMLImageElement');

		reset();
	});

	// ── 11. start() は fraction 0..1 の progress event を発行 ─────
	t.case('start_emits_progress_events_with_fraction_in_range', async function()
	{
		// 準備
		reset();
		var stub = _makeFetchStub({ 'a.txt': 'a', 'b.txt': 'b', 'c.txt': 'c' });
		var origFetch = mitiru.fetch;
		mitiru.fetch = stub;

		p.register([
			{ kind: 'text', path: 'a.txt', key: 'a' },
			{ kind: 'text', path: 'b.txt', key: 'b' },
			{ kind: 'text', path: 'c.txt', key: 'c' },
		]);

		var fractions = [];
		var unsub = p.on('progress', function(d) { fractions.push(d.fraction); });

		// 実行
		await p.start();
		unsub();

		// 検証
		t.assertEq(fractions.length, 3, '3 progress events for 3 items');
		for (var i = 0; i < fractions.length; ++i)
		{
			t.assert(fractions[i] >= 0 && fractions[i] <= 1,
				'fraction[' + i + '] in 0..1, got ' + fractions[i]);
		}
		var last = fractions[fractions.length - 1];
		t.assertClose(last, 1.0, 1e-6, 'final fraction is 1.0');

		mitiru.fetch = origFetch;
		reset();
	});

	// ── 12. start() は loaded+failed 配列とともに complete を発行 ──────
	t.case('start_emits_complete_event_with_loaded_and_failed', async function()
	{
		// 準備
		reset();
		var stub = _makeFetchStub({ 'ok.txt': 'yes' });
		var origFetch = mitiru.fetch;
		mitiru.fetch = stub;

		p.register([{ kind: 'text', path: 'ok.txt', key: 'ok' }]);

		var completes = [];
		var unsub = p.on('complete', function(d) { completes.push(d); });

		// 実行
		await p.start();
		unsub();

		// 検証
		t.assertEq(completes.length, 1, 'exactly one complete event');
		t.assert(completes[0].loaded.indexOf('ok') >= 0, 'ok is in loaded array');
		t.assertEq(completes[0].failed.length, 0, 'failed is empty');

		mitiru.fetch = origFetch;
		reset();
	});

	// ── 13. 404 で item:fail が発火し、読み込みは継続 ────────────
	t.case('item_fail_fires_on_404_loading_continues_complete_has_key', async function()
	{
		// 準備
		reset();
		var stub = _makeFetchStub({ 'good.txt': 'good' });
		var origFetch = mitiru.fetch;
		mitiru.fetch = stub;

		p.register([
			{ kind: 'text', path: 'good.txt',  key: 'good' },
			{ kind: 'text', path: PATH_404,    key: 'bad'  },
		]);

		var fails = [];
		var unsub = p.on('item:fail', function(d) { fails.push(d); });

		// 実行
		var result = await p.start();
		unsub();

		// 検証
		t.assert(result.loaded.indexOf('good') >= 0, 'good item loaded');
		t.assert(result.failed.indexOf('bad')  >= 0, 'bad item in failed');
		t.assertEq(fails.length, 1, 'one item:fail event');
		t.assertEq(fails[0].key, 'bad', 'item:fail key is bad');

		mitiru.fetch = origFetch;
		reset();
	});

	// ── 14. concurrency=2 は同時 in-flight が 2 を超えない ──────
	t.case('concurrency_2_never_exceeds_2_in_flight', async function()
	{
		// 準備
		reset();
		var maxInFlight = 0;
		var inFlight    = 0;

		// 同時呼び出しを数える制御された fetch stub を構築。
		var origFetch = mitiru.fetch;
		mitiru.fetch = function(path)
		{
			inFlight++;
			if (inFlight > maxInFlight) { maxInFlight = inFlight; }
			return new Promise(function(resolve)
			{
				// resolve 前に event loop を tick させる (concurrency を観測可能に)。
				setTimeout(function()
				{
					inFlight--;
					resolve({ text: function() { return Promise.resolve('t'); }, ok: true });
				}, 0);
			});
		};

		p.register([
			{ kind: 'text', path: 'a.txt', key: 'a' },
			{ kind: 'text', path: 'b.txt', key: 'b' },
			{ kind: 'text', path: 'c.txt', key: 'c' },
			{ kind: 'text', path: 'd.txt', key: 'd' },
			{ kind: 'text', path: 'e.txt', key: 'e' },
		]);

		// 実行
		await p.start({ concurrency: 2 });

		// 検証
		t.assert(maxInFlight <= 2, 'max in-flight was ' + maxInFlight + ', expected ≤ 2');

		mitiru.fetch = origFetch;
		reset();
	});

	// ── 15. mount + start: progress bar の幅が fraction を反映 ──
	t.case('mount_and_start_fill_width_reflects_fraction', async function()
	{
		// 準備
		reset();
		var stub = _makeFetchStub({ 'a.txt': 'a', 'b.txt': 'b' });
		var origFetch = mitiru.fetch;
		mitiru.fetch = stub;

		var container = document.createElement('div');
		document.body.appendChild(container);
		p.mount(container, { fadeMs: 0 });
		p.register([
			{ kind: 'text', path: 'a.txt', key: 'a' },
			{ kind: 'text', path: 'b.txt', key: 'b' },
		]);

		var widthsAfterProgress = [];
		var unsub = p.on('progress', function()
		{
			var fill = container.querySelector('.mitiru-preloader__fill');
			if (fill) { widthsAfterProgress.push(fill.style.width); }
		});

		// 実行
		await p.start();
		unsub();

		// 検証。 browser は読み取り時に "100.0%" → "100%" に正規化するので、
		// 文字列ではなく数値として比較する。
		t.assert(widthsAfterProgress.length >= 1, 'fill width was recorded on progress events');
		var last = widthsAfterProgress[widthsAfterProgress.length - 1];
		t.assertEq(parseFloat(last), 100, 'final fill width is 100%');

		document.body.removeChild(container);
		mitiru.fetch = origFetch;
		reset();
	});

	// ── 16. mount + complete: complete 後に fade-out が始まる ──────
	t.case('mount_and_complete_fade_out_applied_after_complete', async function()
	{
		// 準備
		reset();
		var stub = _makeFetchStub({ 'x.txt': 'x' });
		var origFetch = mitiru.fetch;
		mitiru.fetch = stub;

		var container = document.createElement('div');
		document.body.appendChild(container);
		p.mount(container, { fadeMs: 50 });
		p.register([{ kind: 'text', path: 'x.txt', key: 'x' }]);

		// 実行
		await p.start();

		// 検証: complete 直後に opacity は '0' のはず (transition 開始済み)
		var root = container.querySelector('[data-mitiru-preloader]');
		// fadeMs=0 で同期的に削除された場合 root は null になりうる。50ms なら存在する。
		if (root)
		{
			t.assertEq(root.style.opacity, '0', 'opacity set to 0 to start fade-out');
		}
		else
		{
			// 既に削除済み — これも許容。
			t.assert(true, 'root already removed (instant fade)');
		}

		document.body.removeChild(container);
		mitiru.fetch = origFetch;
		reset();
	});

	// ── 17. on/off の subscribe と unsubscribe ─────────────────────
	t.case('on_returns_unsub_fn_off_removes_listener', async function()
	{
		// 準備
		reset();
		var stub = _makeFetchStub({ 'x.txt': 'x' });
		var origFetch = mitiru.fetch;
		mitiru.fetch = stub;

		p.register([{ kind: 'text', path: 'x.txt', key: 'x' }]);

		var count = 0;
		var fn    = function() { count++; };

		// 実行: subscribe してから start
		var unsub = p.on('item:done', fn);
		await p.start();
		t.assertEq(count, 1, 'listener called once on first run');

		// リセットして unsubscribe
		p.clear();
		p.register([{ kind: 'text', path: 'x.txt', key: 'x' }]);
		unsub();
		await p.start();

		// 検証
		t.assertEq(count, 1, 'listener NOT called after unsubscribe');

		// off() も直接テスト
		p.clear();
		p.register([{ kind: 'text', path: 'x.txt', key: 'x' }]);
		var fn2 = function() { count += 10; };
		p.on('item:done', fn2);
		await p.start();
		t.assertEq(count, 11, 'fn2 called once');

		p.clear();
		p.register([{ kind: 'text', path: 'x.txt', key: 'x' }]);
		p.off('item:done', fn2);
		await p.start();
		t.assertEq(count, 11, 'fn2 not called after off()');

		mitiru.fetch = origFetch;
		reset();
	});

	// ── 18. 未知の event type は no-op ─────────────────────────
	t.case('unknown_event_type_noop', function()
	{
		// 準備 + 実行 + 検証: throw してはいけない
		reset();
		var unsub = p.on('totally:unknown:event', function() {});
		t.assert(typeof unsub === 'function', 'on() returns a function for unknown events');
		unsub();  // throw しないはず
		p.off('totally:unknown:event', function() {});  // throw しないはず
		reset();
	});

	// ── 19. 二重 mount() は前のインスタンスを片付ける ───────────────
	t.case('double_mount_is_idempotent_cleans_prior_instance', function()
	{
		// 準備
		reset();
		var container = document.createElement('div');

		// 実行
		p.mount(container);
		p.mount(container);  // 2 度目の mount は 1 度目を置き換えるはず

		// 検証: container 内の root 要素は 1 つだけ
		var roots = container.querySelectorAll('[data-mitiru-preloader]');
		t.assertEq(roots.length, 1, 'only one preloader root after double mount');

		reset();
	});

	// ── 20. 空の registry でも start() は complete event を発行 ──────────
	t.case('start_empty_registry_emits_complete_event', async function()
	{
		// 準備
		reset();
		var completes = [];
		var unsub = p.on('complete', function(d) { completes.push(d); });

		// 実行
		await p.start();
		unsub();

		// 検証
		t.assertEq(completes.length, 1, 'complete fires even for empty registry');
		t.assertEq(completes[0].loaded.length, 0);
		t.assertEq(completes[0].failed.length, 0);
	});

	// ── 21. 読み込み成功した item ごとに item:done が発火 ─────
	t.case('item_done_fires_for_each_successful_item', async function()
	{
		// 準備
		reset();
		var stub = _makeFetchStub({ 'a.txt': 'a', 'b.txt': 'b' });
		var origFetch = mitiru.fetch;
		mitiru.fetch = stub;

		p.register([
			{ kind: 'text', path: 'a.txt', key: 'a' },
			{ kind: 'text', path: 'b.txt', key: 'b' },
		]);

		var dones = [];
		var unsub = p.on('item:done', function(d) { dones.push(d); });

		// 実行
		await p.start();
		unsub();

		// 検証
		t.assertEq(dones.length, 2, 'two item:done events');
		var keys = dones.map(function(d) { return d.key; }).sort();
		t.assertEq(keys[0], 'a');
		t.assertEq(keys[1], 'b');

		mitiru.fetch = origFetch;
		reset();
	});

	// ── 22. progress の currentKey は処理中の item を反映 ─────
	t.case('progress_currentKey_reflects_item_being_processed', async function()
	{
		// 準備
		reset();
		var stub = _makeFetchStub({ 'z.txt': 'z' });
		var origFetch = mitiru.fetch;
		mitiru.fetch = stub;

		p.register([{ kind: 'text', path: 'z.txt', key: 'z' }]);

		var progressKeys = [];
		var unsub = p.on('progress', function(d) { progressKeys.push(d.currentKey); });

		// 実行
		await p.start();
		unsub();

		// 検証
		t.assert(progressKeys.indexOf('z') >= 0, 'currentKey includes z');

		mitiru.fetch = origFetch;
		reset();
	});

	// ── Helpers ──────────────────────────────────────────────────

	/**
	 * 既知の path を resolve する mitiru.fetch stub を構築する。
	 * 未知の path (または PATH_404) は non-ok 応答で reject する。
	 * mode: 'text' (default) | 'json'
	 */
	function _makeFetchStub(map, mode)
	{
		return function(url)
		{
			if (url === PATH_404 || !Object.prototype.hasOwnProperty.call(map, url))
			{
				// text()/json() が throw する 404 を模擬する。
				return Promise.resolve({
					ok:   false,
					status: 404,
					text: function() { return Promise.reject(new Error('404 Not Found: ' + url)); },
					json: function() { return Promise.reject(new Error('404 Not Found: ' + url)); },
				});
			}
			var raw = map[url];
			return Promise.resolve({
				ok:   true,
				status: 200,
				text: function() { return Promise.resolve(raw); },
				json: function()
				{
					try { return Promise.resolve(JSON.parse(raw)); }
					catch (e) { return Promise.reject(e); }
				},
			});
		};
	}

	// ── run ──────────────────────────────────────────────────────
	mitiru.test.run();
})();
</script>
