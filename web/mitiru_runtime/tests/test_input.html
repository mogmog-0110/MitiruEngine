<!--
    test_input.html — mitiru.input (NF-03) unit test

    走らせ方:
      python tools/mitiru_serve.py --port 8770 --no-inject
      open http://127.0.0.1:8770/web/mitiru_runtime/tests/test_input.html

    機械可読な結果:
      window.__testResult  = { pass, fail, tests: [...] }
      window.__testDone    = true
-->
<link rel="stylesheet" href="../mitiru_base.css">
<style>
    body { padding: 16px; font-family: var(--mitiru-font-mono, monospace); }
    pre  { white-space: pre-wrap; }
</style>
<script src="../mitiru_runtime.js"></script>
<script src="../mitiru_test_harness.js"></script>
<script src="../legacy/mitiru_input.js"></script>
<pre id="results">(running...)</pre>
<script>
(function()
{
	'use strict';

	var t = mitiru.test;
	var inp = mitiru.input;

	// ── Gamepad stub factory ──────────────────────────────────
	// 新しい fake pad を返す。caller は buttons/axes を変更し、それを返すよう
	// navigator.getGamepads を stub できる。
	function makeFakePad()
	{
		return {
			id:        'Stub Gamepad',
			connected: true,
			index:     0,
			buttons:   Array.from({ length: 17 }, function() { return { pressed: false, value: 0 }; }),
			axes:      [0, 0, 0, 0],
			vibrationActuator: null,
		};
	}

	function stubGamepads(pads)
	{
		Object.defineProperty(navigator, 'getGamepads', {
			configurable: true,
			value: function() { return pads; },
		});
	}

	function unstubGamepads()
	{
		Object.defineProperty(navigator, 'getGamepads', {
			configurable: true,
			value: function() { return []; },
		});
	}

	// document 上で合成 event を dispatch する。
	function dispatchKey(type, key)
	{
		document.dispatchEvent(new KeyboardEvent(type, { key: key, bubbles: true }));
	}

	function dispatchMouse(type, button)
	{
		document.dispatchEvent(new MouseEvent(type, { button: button, bubbles: true }));
	}

	// 次の RAF tick を待つ (gamepad の polling はそこで走る)。
	function nextFrame()
	{
		return new Promise(function(resolve) { requestAnimationFrame(resolve); });
	}

	// 大半のテストで使う標準の action map。
	var TEST_MAP = {
		confirm: ['Enter', 'Space', 'Gamepad.A'],
		back:    ['Escape', 'Gamepad.B'],
		up:      ['ArrowUp', 'w', 'Gamepad.DPad.Up', 'Gamepad.LStick.Up'],
		down:    ['ArrowDown', 's', 'Gamepad.DPad.Down', 'Gamepad.LStick.Down'],
		menu:    ['Tab', 'Gamepad.Start'],
		skip:    ['Control', 'Gamepad.RT'],
		moveX:   ['Gamepad.LStickX'],
	};

	// ── 1. setActionMap + actionMap の roundtrip ─────────────────
	t.case('setActionMap_actionMap_roundtrip_deep_frozen_snapshot', function()
	{
		inp.setActionMap(TEST_MAP);
		var m = inp.actionMap();
		t.assert(Object.isFrozen(m), 'outer snapshot is frozen');
		t.assert(Object.isFrozen(m.confirm), 'binding array is frozen');
		t.assertEq(m.confirm.slice(), ['Enter', 'Space', 'Gamepad.A']);
		t.assertEq(m.back.slice(),    ['Escape', 'Gamepad.B']);
	});

	// ── 2. 入力前は button が false ─────────────────────
	t.case('button_returns_false_before_any_input', function()
	{
		inp.setActionMap(TEST_MAP);
		t.assertEq(inp.button('confirm'), false);
		t.assertEq(inp.button('back'),    false);
	});

	// ── 3. keydown 中は button が true ────────────────────
	t.case('button_true_while_keydown_Enter_held', function()
	{
		inp.setActionMap(TEST_MAP);
		inp.start();
		try
		{
			dispatchKey('keydown', 'Enter');
			t.assertEq(inp.button('confirm'), true, 'held after keydown');
		}
		finally { inp.stop(); }
	});

	// ── 4. keyup 後は button が false ──────────────────────────
	t.case('button_false_after_keyup_Enter', function()
	{
		inp.setActionMap(TEST_MAP);
		inp.start();
		try
		{
			dispatchKey('keydown', 'Enter');
			t.assertEq(inp.button('confirm'), true);
			dispatchKey('keyup', 'Enter');
			t.assertEq(inp.button('confirm'), false, 'released after keyup');
		}
		finally { inp.stop(); }
	});

	// ── 5. pressed は押された frame のみ true ───────
	t.case('pressed_true_only_on_frame_it_went_down', function()
	{
		inp.setActionMap(TEST_MAP);
		inp.start();
		try
		{
			// pressed は keydown で同期的に立ち、次の RAF でクリアされる。
			dispatchKey('keydown', 'Enter');
			t.assertEq(inp.pressed('confirm'), true, 'pressed on down frame');
			// RAF loop がクリアした後は await 無しでテストできないが、
			// ここで同期的に既に true であることは確認できる。
		}
		finally { inp.stop(); }
	});

	// ── 6. RAF tick がクリアした後は pressed が false ────────────
	t.case('pressed_cleared_after_next_RAF_frame', async function()
	{
		inp.setActionMap(TEST_MAP);
		inp.start();
		try
		{
			dispatchKey('keydown', 'Enter');
			t.assertEq(inp.pressed('confirm'), true);
			await nextFrame();
			await nextFrame();  // 2 tick: loop がクリアし、その後 re-poll する
			t.assertEq(inp.pressed('confirm'), false, 'pressed cleared after RAF');
			t.assertEq(inp.button('confirm'),  true,  'still held');
		}
		finally { inp.stop(); }
	});

	// ── 7. released は離した frame のみ true ────────
	t.case('released_true_only_on_frame_it_went_up', function()
	{
		inp.setActionMap(TEST_MAP);
		inp.start();
		try
		{
			dispatchKey('keydown', 'Enter');
			dispatchKey('keyup',   'Enter');
			t.assertEq(inp.released('confirm'), true, 'released set on keyup');
			t.assertEq(inp.button('confirm'),   false);
		}
		finally { inp.stop(); }
	});

	// ── 8. 未知の action は throw せず false / 0 を返す ────
	t.case('unknown_action_returns_false_or_0_no_throw', function()
	{
		inp.setActionMap(TEST_MAP);
		t.assertNoThrow(function() { inp.button('nonexistent'); });
		t.assertNoThrow(function() { inp.pressed('nonexistent'); });
		t.assertNoThrow(function() { inp.released('nonexistent'); });
		t.assertNoThrow(function() { inp.axis('nonexistent'); });
		t.assertEq(inp.button('nonexistent'),   false);
		t.assertEq(inp.pressed('nonexistent'),  false);
		t.assertEq(inp.released('nonexistent'), false);
		t.assertEq(inp.axis('nonexistent'),     0);
	});

	// ── 9. 複数 binding: どれか 1 つで action が down になる ───
	t.case('multiple_bindings_any_binding_marks_action_down', function()
	{
		inp.setActionMap(TEST_MAP);
		inp.start();
		try
		{
			dispatchKey('keydown', 'Space');
			t.assertEq(inp.button('confirm'), true, 'Space binding fires confirm');
			dispatchKey('keyup', 'Space');
			t.assertEq(inp.button('confirm'), false);
		}
		finally { inp.stop(); }
	});

	// ── 10. active device が keyboard → mouse → 戻る ──────
	t.case('active_device_flips_keyboard_mouse_keyboard', function()
	{
		inp.setActionMap(TEST_MAP);
		inp.start();
		try
		{
			dispatchKey('keydown', 'Enter');
			t.assertEq(inp.activeDevice(), 'keyboard');
			dispatchKey('keyup', 'Enter');

			dispatchMouse('mousedown', 0);
			t.assertEq(inp.activeDevice(), 'mouse');
			dispatchMouse('mouseup', 0);

			dispatchKey('keydown', 'Escape');
			t.assertEq(inp.activeDevice(), 'keyboard');
			dispatchKey('keyup', 'Escape');
		}
		finally { inp.stop(); }
	});

	// ── 11. device:change event が {from, to} で発火 ────────
	t.case('device_change_event_fires_with_from_to', function()
	{
		inp.setActionMap(TEST_MAP);
		inp.start();
		var changes = [];
		var unsub = inp.on('device:change', function(d) { changes.push(d); });
		try
		{
			// keyboard で開始 (既定)。mouse event で切り替わる。
			dispatchMouse('mousedown', 0);
			t.assert(changes.length >= 1, 'device:change fired');
			t.assertEq(changes[0].to,   'mouse');
			t.assertEq(changes[0].from, 'keyboard');
			dispatchMouse('mouseup', 0);
		}
		finally
		{
			unsub();
			inp.stop();
		}
	});

	// ── 12. action:down / action:up event が発火 ───────────────
	t.case('action_down_and_up_events_fire_with_detail', function()
	{
		inp.setActionMap(TEST_MAP);
		inp.start();
		var downs = [];
		var ups   = [];
		var u1 = inp.on('action:down', function(d) { downs.push(d); });
		var u2 = inp.on('action:up',   function(d) { ups.push(d);   });
		try
		{
			dispatchKey('keydown', 'Enter');
			t.assert(downs.length >= 1, 'action:down fired');
			t.assertEq(downs[0].action,  'confirm');
			t.assertEq(downs[0].binding, 'Enter');
			t.assertEq(downs[0].device,  'keyboard');

			dispatchKey('keyup', 'Enter');
			t.assert(ups.length >= 1, 'action:up fired');
			t.assertEq(ups[0].action,  'confirm');
			t.assertEq(ups[0].binding, 'Enter');
		}
		finally
		{
			u1(); u2();
			inp.stop();
		}
	});

	// ── 13. promptFor は active device に合う最初の binding を返す ─
	t.case('promptFor_returns_first_binding_for_active_device', function()
	{
		inp.setActionMap(TEST_MAP);
		inp.start();
		try
		{
			dispatchKey('keydown', 'Enter');
			// active device は keyboard。confirm の最初の keyboard binding = 'Enter'。
			t.assertEq(inp.promptFor('confirm'), 'Enter');
			dispatchKey('keyup', 'Enter');
		}
		finally { inp.stop(); }
	});

	// ── 14. device が gamepad のとき promptFor は gamepad binding を返す
	t.case('promptFor_returns_Gamepad_A_when_device_is_gamepad', async function()
	{
		inp.setActionMap(TEST_MAP);
		var fakePad = makeFakePad();
		stubGamepads([fakePad]);
		inp.start();
		try
		{
			// active device を gamepad に切り替えるため A ボタン押下を模擬。
			fakePad.buttons[0].pressed = true;
			await nextFrame();
			await nextFrame();
			t.assertEq(inp.activeDevice(), 'gamepad');
			t.assertEq(inp.promptFor('confirm'), 'Gamepad.A');
		}
		finally
		{
			inp.stop();
			unstubGamepads();
		}
	});

	// ── 15. promptFor は未知の action で null を返す ─────────────
	t.case('promptFor_unknown_action_returns_null', function()
	{
		inp.setActionMap(TEST_MAP);
		var result = inp.promptFor('nonexistent');
		t.assert(result === null || result === '' || result === undefined,
			'promptFor unknown returns null/empty');
	});

	// ── 16. setDeadzone — deadzone 未満の axis は 0 を返す ──────
	t.case('setDeadzone_axis_below_deadzone_returns_0', async function()
	{
		inp.setDeadzone(0.2);
		inp.setActionMap({ moveX: ['Gamepad.LStickX'] });
		var fakePad = makeFakePad();
		fakePad.axes[0] = 0.1;  // deadzone 未満
		stubGamepads([fakePad]);
		inp.start();
		try
		{
			await nextFrame();
			t.assertEq(inp.axis('moveX'), 0, 'below deadzone → 0');
		}
		finally
		{
			inp.stop();
			unstubGamepads();
			inp.setDeadzone(0.15);  // 元に戻す
		}
	});

	// ── 17. setDeadzone — deadzone 以上の axis は値を返す ──
	t.case('setDeadzone_axis_above_deadzone_returns_value', async function()
	{
		inp.setDeadzone(0.2);
		inp.setActionMap({ moveX: ['Gamepad.LStickX'] });
		var fakePad = makeFakePad();
		fakePad.axes[0] = 0.8;
		stubGamepads([fakePad]);
		inp.start();
		try
		{
			await nextFrame();
			t.assertClose(inp.axis('moveX'), 0.8, 0.001, 'above deadzone → raw value');
		}
		finally
		{
			inp.stop();
			unstubGamepads();
			inp.setDeadzone(0.15);
		}
	});

	// ── 18. gamepad シミュレーション — A ボタン押下が action:down を発火 ─
	t.case('gamepad_stub_A_button_fires_action_down', async function()
	{
		inp.setActionMap(TEST_MAP);
		var fakePad = makeFakePad();
		stubGamepads([fakePad]);
		var downs = [];
		var unsub = inp.on('action:down', function(d) { downs.push(d); });
		inp.start();
		try
		{
			fakePad.buttons[0].pressed = true;
			await nextFrame();
			await nextFrame();
			var confirmDown = downs.filter(function(d) { return d.action === 'confirm'; });
			t.assert(confirmDown.length >= 1, 'confirm action:down from Gamepad.A');
			t.assertEq(confirmDown[0].binding, 'Gamepad.A');
			t.assertEq(confirmDown[0].device,  'gamepad');
		}
		finally
		{
			unsub();
			inp.stop();
			unstubGamepads();
		}
	});

	// ── 19. gamepad シミュレーション — A ボタン解放が action:up を発火 ─
	t.case('gamepad_stub_A_button_release_fires_action_up', async function()
	{
		inp.setActionMap(TEST_MAP);
		var fakePad = makeFakePad();
		stubGamepads([fakePad]);
		var ups   = [];
		var unsub = inp.on('action:up', function(d) { ups.push(d); });
		inp.start();
		try
		{
			fakePad.buttons[0].pressed = true;
			await nextFrame();
			await nextFrame();
			fakePad.buttons[0].pressed = false;
			await nextFrame();
			await nextFrame();
			var confirmUp = ups.filter(function(d) { return d.action === 'confirm'; });
			t.assert(confirmUp.length >= 1, 'confirm action:up from Gamepad.A release');
		}
		finally
		{
			unsub();
			inp.stop();
			unstubGamepads();
		}
	});

	// ── 20. 仮想スティックボタン — Y < -deadzone で LStick.Up が発火 ─
	t.case('virtual_stick_LStick_Up_fires_when_Y_below_negative_deadzone', async function()
	{
		inp.setDeadzone(0.15);
		inp.setActionMap(TEST_MAP);
		var fakePad = makeFakePad();
		stubGamepads([fakePad]);
		var downs = [];
		var unsub = inp.on('action:down', function(d) { downs.push(d); });
		inp.start();
		try
		{
			// Y axis 1 (LStickY)。Up = 負の方向。
			fakePad.axes[1] = -0.9;
			await nextFrame();
			await nextFrame();
			var upDown = downs.filter(function(d) { return d.action === 'up'; });
			t.assert(upDown.length >= 1, 'up action fires from LStick.Up');
		}
		finally
		{
			unsub();
			inp.stop();
			unstubGamepads();
		}
	});

	// ── 21. axis は現在の LStickX 値を返す ───────────────
	t.case('axis_returns_current_LStickX_value', async function()
	{
		inp.setDeadzone(0.15);
		inp.setActionMap({ moveX: ['Gamepad.LStickX'] });
		var fakePad = makeFakePad();
		fakePad.axes[0] = 0.75;
		stubGamepads([fakePad]);
		inp.start();
		try
		{
			await nextFrame();
			t.assertClose(inp.axis('moveX'), 0.75, 0.001);
		}
		finally
		{
			inp.stop();
			unstubGamepads();
		}
	});

	// ── 22. gamepad 無しの rumble は no-op; 1 回 warn ─────────
	t.case('rumble_no_gamepad_no_throw_warns_once', function()
	{
		unstubGamepads();
		var warnCount = 0;
		var origWarn  = console.warn;
		console.warn  = function() { warnCount++; };
		try
		{
			t.assertNoThrow(function() { inp.rumble(100); });
			t.assertNoThrow(function() { inp.rumble(100); });  // 2 度目は再度 warn してはいけない
			// warnCount は 1 (最初の rumble) か、先行テストが既に warn 済みなら 0 になりうる。
			// singleton state が残るので、throw しないことだけ確認し正確な count は見ない。
			t.assert(true, 'no throw from rumble without gamepad');
		}
		finally { console.warn = origWarn; }
	});

	// ── 23. start は冪等 — 2 回呼んでも二重 bind しない ─
	t.case('start_idempotent_no_double_bind', function()
	{
		inp.setActionMap(TEST_MAP);
		inp.start();
		inp.start();  // 2 度目の呼び出しは no-op のはず
		var events = [];
		var unsub  = inp.on('action:down', function(d) { events.push(d); });
		try
		{
			dispatchKey('keydown', 'Enter');
			// 二重 bind なら event は 2 件になる。ちょうど 1 件を期待する。
			t.assertEq(events.length, 1, 'exactly one action:down despite double start');
			dispatchKey('keyup', 'Enter');
		}
		finally
		{
			unsub();
			inp.stop();
		}
	});

	// ── 24. stop は listener を取り除き、以降の keydown は無視 ─
	t.case('stop_removes_listeners_subsequent_keydowns_ignored', function()
	{
		inp.setActionMap(TEST_MAP);
		inp.start();
		inp.stop();
		// stop 後は state がリセットされ listener が取り除かれる。
		dispatchKey('keydown', 'Enter');
		t.assertEq(inp.button('confirm'), false, 'keydown after stop does not affect state');
	});

	// ── 25. on / off の subscribe と unsubscribe ────────────────
	t.case('on_off_subscribe_and_unsubscribe', function()
	{
		inp.setActionMap(TEST_MAP);
		inp.start();
		var count = 0;
		var fn    = function() { count++; };
		var unsub = inp.on('action:down', fn);
		try
		{
			dispatchKey('keydown', 'Enter');
			t.assertEq(count, 1, 'listener called after on()');
			dispatchKey('keyup', 'Enter');

			unsub();
			dispatchKey('keydown', 'Enter');
			t.assertEq(count, 1, 'listener NOT called after unsubscribe via returned fn');
			dispatchKey('keyup', 'Enter');

			// inp.off も直接テスト。
			var fn2 = function() { count += 10; };
			inp.on('action:down', fn2);
			dispatchKey('keydown', 'Enter');
			t.assertEq(count, 11, 'fn2 called once');
			dispatchKey('keyup', 'Enter');

			inp.off('action:down', fn2);
			dispatchKey('keydown', 'Enter');
			t.assertEq(count, 11, 'fn2 not called after off()');
			dispatchKey('keyup', 'Enter');
		}
		finally { inp.stop(); }
	});

	// ── 26. 動作中の setActionMap は安全 ────────────────
	t.case('setActionMap_while_running_is_safe', function()
	{
		inp.setActionMap(TEST_MAP);
		inp.start();
		try
		{
			dispatchKey('keydown', 'Enter');
			t.assertEq(inp.button('confirm'), true);

			// 動作中に map を差し替え; state はリセットされる。
			inp.setActionMap({ jump: ['Space'] });
			t.assertEq(inp.button('confirm'), false, 'old action reset after setActionMap');
			t.assertEq(inp.button('jump'),    false, 'new action starts false');
		}
		finally { inp.stop(); }
	});

	// ── 27. mouse ボタンの binding が action を発火 ─────────────────
	t.case('mouse_binding_Mouse0_fires_action_down', function()
	{
		inp.setActionMap({ shoot: ['Mouse.0'] });
		inp.start();
		var downs = [];
		var unsub = inp.on('action:down', function(d) { downs.push(d); });
		try
		{
			dispatchMouse('mousedown', 0);
			var shootDown = downs.filter(function(d) { return d.action === 'shoot'; });
			t.assert(shootDown.length >= 1, 'shoot action:down from Mouse.0');
			t.assertEq(shootDown[0].binding, 'Mouse.0');
			t.assertEq(shootDown[0].device,  'mouse');
			t.assertEq(inp.button('shoot'),  true);
			dispatchMouse('mouseup', 0);
			t.assertEq(inp.button('shoot'),  false);
		}
		finally
		{
			unsub();
			inp.stop();
		}
	});

	// ── run ──────────────────────────────────────────────────
	mitiru.test.run();
})();
</script>
