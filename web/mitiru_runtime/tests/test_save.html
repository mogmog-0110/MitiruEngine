      window.__testDone    = true

<link rel="stylesheet" href="../mitiru_base.css">
<style>
    body { padding: 16px; font-family: var(--mitiru-font-mono, monospace); }
    pre  { white-space: pre-wrap; }
</style>
<script src="../mitiru_runtime.js"></script>
<script src="../mitiru_test_harness.js"></script>
<script src="../mitiru_cef_state.js"></script>
<script src="../mitiru_save.js"></script>
<pre id="results">(running...)</pre>
<script>
(function()
{
	'use strict';

	const t = mitiru.test;
	const s = mitiru.save;

	// ── helpers ──────────────────────────────────────────────────
	// テストを独立させるため、テスト間ですべての save slot をクリアする。
	async function clearAll()
	{
		for (let i = 0; i < s.MAX_SLOTS; ++i)
		{
			await s.delete(i);
		}
	}

	// ── 1. constants ─────────────────────────────────────────────
	t.case('MAX_SLOTS === 10', function()
	{
		t.assertEq(s.MAX_SLOTS, 10);
	});

	t.case('SCHEMA_VERSION is a positive integer', function()
	{
		t.assert(typeof s.SCHEMA_VERSION === 'number' && s.SCHEMA_VERSION >= 1,
		         'SCHEMA_VERSION should be >= 1');
	});

	// ── 2. 空の slot ─────────────────────────────────────────────
	t.case('read empty slot returns null', async function()
	{
		await clearAll();
		const result = await s.read(0);
		t.assertEq(result, null);
	});

	// ── 3. write + read の round-trip ────────────────────────────────
	t.case('write + read round-trip (localStorage backend)', async function()
	{
		await clearAll();
		const data = { chapter: 3, gold: 420, flags: { metMaria: true } };
		await s.write(0, data);
		const result = await s.read(0);
		t.assert(result !== null, 'read should return non-null after write');
		t.assertEq(result.data.chapter, 3);
		t.assertEq(result.data.gold, 420);
		t.assertEq(result.data.flags.metMaria, true);
	});

	// ── 4. metadata が保持され timestamp が自動設定される ───────────────
	t.case('metadata is preserved and timestamp is auto-set', async function()
	{
		await clearAll();
		const before = Date.now();
		await s.write(1, { hp: 100 }, { title: 'Day 3', description: 'Afternoon' });
		const after  = Date.now();
		const result = await s.read(1);
		t.assert(result !== null, 'slot should be readable');
		t.assertEq(result.meta.title,       'Day 3');
		t.assertEq(result.meta.description, 'Afternoon');
		t.assert(result.meta.timestamp >= before && result.meta.timestamp <= after,
		         'timestamp should be within the write window');
	});

	// ── 5. list はちょうど MAX_SLOTS 個の entry を返す ─────────────────
	t.case('list returns exactly MAX_SLOTS entries', async function()
	{
		await clearAll();
		const slots = await s.list();
		t.assertEq(slots.length, s.MAX_SLOTS);
	});

	// ── 6. list は書き込み済み slot を exists:true にする ────────────────
	t.case('list marks written slot as exists:true', async function()
	{
		await clearAll();
		await s.write(2, { score: 999 });
		const slots = await s.list();
		const entry2 = slots.find(function(e) { return e.slot === 2; });
		const entry3 = slots.find(function(e) { return e.slot === 3; });
		t.assert(entry2 !== undefined,  'slot 2 should appear in list');
		t.assertEq(entry2.exists, true, 'slot 2 should be marked exists');
		t.assertEq(entry3.exists, false,'slot 3 should be empty');
	});

	// ── 7. delete は data と meta を削除する ──────────────────────────
	t.case('delete removes data + meta', async function()
	{
		await clearAll();
		await s.write(4, { day: 1 });
		await s.delete(4);
		const result = await s.read(4);
		t.assertEq(result, null, 'slot should be empty after delete');
		const slots = await s.list();
		const entry4 = slots.find(function(e) { return e.slot === 4; });
		t.assertEq(entry4.exists, false, 'list should show slot as empty after delete');
	});

	// ── 8. 空 slot への delete は no-op ─────────────────────────
	t.case('delete on empty slot does not throw', async function()
	{
		await clearAll();
		// throw してはいけない — 存在しない slot の削除は問題ない。
		await s.delete(5);
		const result = await s.read(5);
		t.assertEq(result, null);
	});

	// ── 9. read 時に migration が適用される ─────────────────────────────
	t.case('registerMigration applied on read when version mismatches', async function()
	{
		await clearAll();

		// migration が起動するよう v0 blob を手動で注入する。
		const v0Blob = JSON.stringify({
			version:     0,
			timestamp:   Date.now(),
			playtimeMs:  0,
			title:       '',
			description: '',
			thumbnailDataUrl: '',
			data:        { legacy: 'value' },
		});
		localStorage.setItem('mitiru.save.slot.6.data', v0Blob);
		localStorage.setItem('mitiru.save.slot.6.meta', JSON.stringify({ version: 0, title: '' }));

		// migration 0 → 1 を登録する。
		s.registerMigration(0, 1, function(old)
		{
			return Object.assign({}, old, { migrated: true, newField: 'added' });
		});

		const result = await s.read(6);
		t.assert(result !== null, 'slot should be readable');
		t.assertEq(result.data.legacy,   'value', 'original field preserved');
		t.assertEq(result.data.migrated, true,    'migration flag applied');
		t.assertEq(result.data.newField, 'added', 'new field from migration present');

		// 後始末: 他テストに漏れないようテスト用 migration を取り除く。
		// (_migrations から直接削除できない — 配列長の知識を使う。)
		await clearAll();
	});

	// ── 10. 複数 migration が順番に連鎖する ───────────────────
	t.case('migrations chain in order: 1→2, 2→3', async function()
	{
		await clearAll();

		// v1 blob を注入する。
		const v1Blob = JSON.stringify({
			version:     1,
			timestamp:   Date.now(),
			playtimeMs:  0,
			title:       '',
			description: '',
			thumbnailDataUrl: '',
			data:        { v1data: 'hello' },
		});
		localStorage.setItem('mitiru.save.slot.7.data', v1Blob);
		localStorage.setItem('mitiru.save.slot.7.meta', JSON.stringify({ version: 1, title: '' }));

		// 連鎖する 2 つの migration を登録する。
		s.registerMigration(1, 2, function(old)
		{
			return Object.assign({}, old, { step2: true });
		});
		s.registerMigration(2, 3, function(old)
		{
			return Object.assign({}, old, { step3: true });
		});

		const result = await s.read(7);
		t.assert(result !== null, 'slot should be readable');
		t.assertEq(result.data.v1data, 'hello', 'original data preserved through chain');
		t.assertEq(result.data.step2,  true,    'v1→v2 migration applied');
		t.assertEq(result.data.step3,  true,    'v2→v3 migration applied');

		await clearAll();
	});

	// ── 11. 不正な slot への write は throw ─────────────────────────
	t.case('write to invalid slot index throws synchronously', function()
	{
		t.assertThrow(function() { s.write(-1,  {}); }, 'negative slot should throw');
		t.assertThrow(function() { s.write(10, {}); }, 'slot === MAX_SLOTS should throw');
		t.assertThrow(function() { s.write(1.5, {}); }, 'fractional slot should throw');
	});

	// ── 12. 大きな write が隣の slot を壊さない ────────────
	t.case('~1 MB write to slot 0 does not corrupt slot 1', async function()
	{
		await clearAll();

		// まず slot 1 に既知の sentinel を書き込む。
		await s.write(1, { sentinel: 'untouched' });

		// slot 0 に ~1 MB のデータを書き込む。
		const bigString = new Array(1024 * 1024 / 2 + 1).join('x');  // ~512 KB 文字 = ~1 MB UTF-16
		await s.write(0, { payload: bigString });

		// slot 0 が読めて大きいデータを含むことを確認する。
		const r0 = await s.read(0);
		t.assert(r0 !== null,                 'slot 0 should be readable after large write');
		t.assert(r0.data.payload.length > 0,  'slot 0 payload should be non-empty');

		// slot 1 の sentinel がまだ無事なことを確認する。
		const r1 = await s.read(1);
		t.assert(r1 !== null,                           'slot 1 should still be readable');
		t.assertEq(r1.data.sentinel, 'untouched',       'slot 1 data should be unaffected');

		await clearAll();
	});

	// ── 13. cefQuery 無しで backend() は 'localStorage' を返す ────
	t.case("backend() returns 'localStorage' when cefQuery is absent", function()
	{
		// 素の browser / テスト環境では cefQuery は未定義。
		const saved = window.cefQuery;
		delete window.cefQuery;
		t.assertEq(s.backend(), 'localStorage');
		if (saved !== undefined) { window.cefQuery = saved; }
	});

	// ── 14. cefQuery があると backend() は 'cef' を返す ─────
	t.case("backend() returns 'cef' when cefQuery stub is installed", function()
	{
		const saved = window.cefQuery;

		// 最小限の stub を仕込む。
		window.cefQuery = function(opts)
		{
			if (opts.onSuccess) { opts.onSuccess('{"ok":true}'); }
			return {};
		};

		t.assertEq(s.backend(), 'cef');

		// 元に戻す。
		if (saved !== undefined)
		{
			window.cefQuery = saved;
		}
		else
		{
			delete window.cefQuery;
		}
	});

	// ── 15. staging key による atomic write の復旧 ─────────────────
	t.case('staging key recovery: read uses staging data when data key is absent', async function()
	{
		await clearAll();

		// 中断された write を模擬: staging key のみ書き込まれた状態。
		const blob = JSON.stringify({
			version:     1,
			timestamp:   Date.now(),
			playtimeMs:  0,
			title:       'staged',
			description: '',
			thumbnailDataUrl: '',
			data:        { recovered: true },
		});
		localStorage.setItem('mitiru.save.slot.8.staging', blob);
		// 意図的に .data や .meta は設定しない。

		const result = await s.read(8);
		t.assert(result !== null,             'read should recover from staging key');
		t.assertEq(result.data.recovered, true, 'staged data should be returned');
		t.assertEq(result.meta.title, 'staged', 'staged meta.title should be returned');

		await clearAll();
	});

	// ── 16. currentVersion() ─────────────────────────────────────
	t.case('currentVersion() returns SCHEMA_VERSION', function()
	{
		t.assertEq(s.currentVersion(), s.SCHEMA_VERSION);
	});

	// ── 17. exportSlot は正しい形の Blob を生成する ─────────
	t.case('exportSlot: produces Blob containing slot data', async function()
	{
		await clearAll();
		const payload = { scene: 'forest', flags: { talked: true } };
		await s.write(0, payload, { title: 'Export Test' });

		const blob = await s.exportSlot(0);
		t.assert(blob instanceof Blob, 'exportSlot should return a Blob');

		const text   = await blob.text();
		const bundle = JSON.parse(text);
		t.assertEq(bundle.engineVersion, s.SCHEMA_VERSION, 'bundle.engineVersion matches SCHEMA_VERSION');
		t.assert(bundle.slots && typeof bundle.slots === 'object', 'bundle.slots is an object');
		t.assert(bundle.slots['0'] !== undefined, 'slot 0 entry present in bundle');
		t.assertEq(bundle.slots['0'].data.scene,          'forest', 'scene preserved in raw blob');
		t.assertEq(bundle.slots['0'].data.flags.talked,   true,     'nested flag preserved');
		t.assertEq(bundle.slots['0'].title,               'Export Test', 'meta.title preserved in raw blob');

		await clearAll();
	});

	// ── 18. 空 slot の exportSlot は空の slots object を返す ────
	t.case('exportSlot: empty slot yields bundle with no slot entry', async function()
	{
		await clearAll();
		const blob   = await s.exportSlot(3);
		const text   = await blob.text();
		const bundle = JSON.parse(text);
		t.assertEq(bundle.engineVersion, s.SCHEMA_VERSION);
		t.assert(bundle.slots['3'] === undefined, 'empty slot should not appear in bundle.slots');
	});

	// ── 19. exportAll は使用中の slot だけを束ねる ─────────────────
	t.case('exportAll: bundles all occupied slots, skips empty ones', async function()
	{
		await clearAll();
		await s.write(1, { x: 1 });
		await s.write(3, { x: 3 });

		const blob   = await s.exportAll();
		const text   = await blob.text();
		const bundle = JSON.parse(text);
		t.assertEq(bundle.engineVersion, s.SCHEMA_VERSION);
		t.assert(bundle.slots['1'] !== undefined, 'slot 1 present');
		t.assert(bundle.slots['3'] !== undefined, 'slot 3 present');
		t.assert(bundle.slots['0'] === undefined, 'slot 0 absent (empty)');
		t.assert(bundle.slots['2'] === undefined, 'slot 2 absent (empty)');
		t.assertEq(bundle.slots['1'].data.x, 1);
		t.assertEq(bundle.slots['3'].data.x, 3);

		await clearAll();
	});

	// ── 20. importSlot の round-trip ─────────────────────────────────
	t.case('importSlot: imports slot data into target slot', async function()
	{
		await clearAll();
		await s.write(2, { level: 7 }, { title: 'Import Test' });
		const blob = await s.exportSlot(2);
		await s.delete(2);

		// import 前に削除済みであることを確認。
		t.assertEq(await s.read(2), null, 'slot should be empty before import');

		await s.importSlot(blob, 2);

		const result = await s.read(2);
		t.assert(result !== null, 'slot should be populated after importSlot');
		t.assertEq(result.data.level, 7,             'data.level preserved through export/import');
		t.assertEq(result.meta.title, 'Import Test', 'meta.title preserved through export/import');

		await clearAll();
	});

	// ── 21. importSlot: bundle に無い slot は no-op ────────────
	t.case('importSlot: slot absent in bundle resolves as no-op', async function()
	{
		await clearAll();
		await s.write(0, { sentinel: 'keep' });

		// slot 1 (空) を export — slot 0 は bundle に含まれない。
		const blob = await s.exportSlot(1);
		// その bundle を slot 0 に import; slot 0 の entry が無い → no-op。
		await s.importSlot(blob, 0);

		const result = await s.read(0);
		t.assert(result !== null,                  'slot 0 should still have data');
		t.assertEq(result.data.sentinel, 'keep',   'existing slot 0 data must be untouched');

		await clearAll();
	});

	// ── 22. importAll の round-trip ──────────────────────────────────
	t.case('importAll: restores all exported slots and reports counts', async function()
	{
		await clearAll();
		await s.write(0, { q: 0 });
		await s.write(2, { q: 2 });
		await s.write(5, { q: 5 });

		const blob = await s.exportAll();

		// import 前に消去する。
		await clearAll();

		const report = await s.importAll(blob);

		t.assert(Array.isArray(report.imported), 'report.imported is an array');
		t.assert(Array.isArray(report.skipped),  'report.skipped is an array');
		t.assert(report.imported.indexOf(0) !== -1, 'slot 0 in imported list');
		t.assert(report.imported.indexOf(2) !== -1, 'slot 2 in imported list');
		t.assert(report.imported.indexOf(5) !== -1, 'slot 5 in imported list');
		t.assertEq(report.imported.length + report.skipped.length, s.MAX_SLOTS,
		           'imported + skipped must equal MAX_SLOTS');

		t.assertEq((await s.read(0)).data.q, 0, 'slot 0 data restored');
		t.assertEq((await s.read(2)).data.q, 2, 'slot 2 data restored');
		t.assertEq((await s.read(5)).data.q, 5, 'slot 5 data restored');

		await clearAll();
	});

	// ── 23. importSlot は runtime より新しい engineVersion を reject ───
	t.case('importSlot: rejects bundle with engineVersion > SCHEMA_VERSION', async function()
	{
		await clearAll();
		const futureBundle = JSON.stringify({
			engineVersion: s.SCHEMA_VERSION + 9999,
			slots:         { '0': { version: 9999, timestamp: Date.now(), playtimeMs: 0, title: '', description: '', thumbnailDataUrl: '', data: {} } },
		});
		const blob = new Blob([futureBundle], { type: 'application/octet-stream' });

		let threw = false;
		await s.importSlot(blob, 0).catch(function(e)
		{
			threw = true;
			t.assert(e.message.indexOf('engineVersion') !== -1, 'error message should mention engineVersion');
			t.assert(e.message.indexOf('SCHEMA_VERSION') !== -1, 'error message should mention SCHEMA_VERSION');
		});
		t.assert(threw, 'importSlot should reject for future engineVersion');

		await clearAll();
	});

	// ── 24. importAll は runtime より新しい engineVersion を reject ────
	t.case('importAll: rejects bundle with engineVersion > SCHEMA_VERSION', async function()
	{
		await clearAll();
		const futureBundle = JSON.stringify({
			engineVersion: s.SCHEMA_VERSION + 9999,
			slots:         {},
		});
		const blob = new Blob([futureBundle], { type: 'application/octet-stream' });

		let threw = false;
		await s.importAll(blob).catch(function(e)
		{
			threw = true;
			t.assert(e.message.indexOf('engineVersion') !== -1, 'error mentions engineVersion');
		});
		t.assert(threw, 'importAll should reject for future engineVersion');

		await clearAll();
	});

	// ── 25. importSlot の不正な slot は同期的に throw ──────────
	t.case('importSlot: invalid slot throws synchronously', function()
	{
		const dummyBlob = new Blob(['{}'], { type: 'application/octet-stream' });
		t.assertThrow(function() { s.importSlot(dummyBlob, -1);  }, 'negative slot should throw');
		t.assertThrow(function() { s.importSlot(dummyBlob, 10);  }, 'slot === MAX_SLOTS should throw');
		t.assertThrow(function() { s.importSlot(dummyBlob, 1.5); }, 'fractional slot should throw');
	});

	// ── 26. exportSlot の不正な slot は同期的に throw ──────────
	t.case('exportSlot: invalid slot throws synchronously', function()
	{
		t.assertThrow(function() { s.exportSlot(-1);  }, 'negative slot should throw');
		t.assertThrow(function() { s.exportSlot(10);  }, 'slot === MAX_SLOTS should throw');
	});

	// ── NF-09: import 時の multi-step migration chain ───────────────
	// 0→1, 1→2, 2→3 を登録した既存テスト 9/10 との衝突を避けるため
	// version 範囲 100-103 を使う。

	// ── 27. NF-09: importSlot で single-step migration が発火 ──────
	t.case('NF-09: importSlot applies v100→v101 migration', async function()
	{
		await clearAll();

		// 100 → 101 の migration を登録する。
		s.registerMigration(100, 101, function(old)
		{
			return Object.assign({}, old, { upgraded100to101: true });
		});

		// v100 blob を slot に手動注入し export する。
		const rawBlob = JSON.stringify({
			version:          100,
			timestamp:        Date.now(),
			playtimeMs:       0,
			title:            'v100 save',
			description:      '',
			thumbnailDataUrl: '',
			data:             { legacyField: 'present' },
		});
		const bundle = JSON.stringify({ engineVersion: s.SCHEMA_VERSION, slots: { '0': JSON.parse(rawBlob) } });
		const blob   = new Blob([bundle], { type: 'application/octet-stream' });

		await s.importSlot(blob, 0);

		const result = await s.read(0);
		t.assert(result !== null,                           'slot should be readable after import');
		t.assertEq(result.data.legacyField, 'present',     'legacy field preserved');
		t.assertEq(result.data.upgraded100to101, true,     '100→101 migration applied');

		await clearAll();
	});

	// ── 28. NF-09: importAll で three-step chain 100→101→102→103 ──
	t.case('NF-09: importAll applies full v100→v101→v102→v103 chain', async function()
	{
		await clearAll();

		// migration 101→102 と 102→103 — 100→101 は test 27 で登録済み。
		s.registerMigration(101, 102, function(old)
		{
			return Object.assign({}, old, { upgraded101to102: true });
		});
		s.registerMigration(102, 103, function(old)
		{
			return Object.assign({}, old, { upgraded102to103: true });
		});

		// slot 4 に v100 blob を持つ bundle を構築する。
		const rawBlob = {
			version:          100,
			timestamp:        Date.now(),
			playtimeMs:       0,
			title:            'v100 chain',
			description:      '',
			thumbnailDataUrl: '',
			data:             { base: 'value' },
		};
		const bundle = JSON.stringify({ engineVersion: s.SCHEMA_VERSION, slots: { '4': rawBlob } });
		const blob   = new Blob([bundle], { type: 'application/octet-stream' });

		const report = await s.importAll(blob);

		t.assert(report.imported.indexOf(4) !== -1, 'slot 4 should be in imported list');

		const result = await s.read(4);
		t.assert(result !== null,                         'slot 4 should be readable');
		t.assertEq(result.data.base,              'value', 'base data preserved through full chain');
		t.assertEq(result.data.upgraded100to101,  true,   '100→101 step applied');
		t.assertEq(result.data.upgraded101to102,  true,   '101→102 step applied');
		t.assertEq(result.data.upgraded102to103,  true,   '102→103 step applied');

		await clearAll();
	});

	// ── 29. NF-09: throw する migration は rejection を生む ─────
	t.case('NF-09: broken migration in importSlot rejects promise', async function()
	{
		await clearAll();

		// 常に throw する migration を登録する。
		s.registerMigration(103, 104, function(_old)
		{
			throw new Error('intentional migration failure');
		});

		// 103→104 の migration を起動するため v103 blob 入りの bundle。
		const rawBlob = {
			version:          103,
			timestamp:        Date.now(),
			playtimeMs:       0,
			title:            '',
			description:      '',
			thumbnailDataUrl: '',
			data:             { x: 1 },
		};
		const bundle = JSON.stringify({ engineVersion: s.SCHEMA_VERSION, slots: { '0': rawBlob } });
		const blob   = new Blob([bundle], { type: 'application/octet-stream' });

		let threw = false;
		await s.importSlot(blob, 0).catch(function(e)
		{
			threw = true;
			t.assert(e.message.indexOf('migration') !== -1, 'error should mention migration');
		});
		t.assert(threw, 'importSlot should reject when migration throws');

		await clearAll();
	});

	// ── run ──────────────────────────────────────────────────────
	mitiru.test.run();

})();
</script>
