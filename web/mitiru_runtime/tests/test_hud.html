<!doctype html>
<meta charset="utf-8">
<title>mitiru_hud.js tests</title>
<!--
    test_hud.html — mitiru.hud (F-08) unit test
    パターン: inline IIFE、module import 無し — test_state.html のスタイルに合わせる。

    走らせ方:
      python -m http.server 8765 --bind 127.0.0.1
      open http://localhost:8765/web/mitiru_runtime/tests/test_hud.html

    機械可読な結果:
      window.__testResult  = { pass, fail, tests: [...] }
      window.__testDone    = true
-->
<link rel="stylesheet" href="../mitiru_base.css">
<style>
    body { padding: 16px; font-family: var(--mitiru-font-mono, monospace); }
    pre  { white-space: pre-wrap; }
</style>
<script src="../mitiru_runtime.js"></script>
<script src="../mitiru_test_harness.js"></script>
<script src="../legacy/mitiru_state.js"></script>
<script src="../legacy/mitiru_hud.js"></script>
<pre id="results">(running...)</pre>
<script>
(function()
{
    'use strict';

    var t   = mitiru.test;
    var s   = mitiru.state;
    var hud = mitiru.hud;

    // ── helpers ──────────────────────────────────────────────────

    /**
     * 各テスト用に最小限の独立 container を作る。
     * DOM メソッドが動くよう document.body に append した <div> を返すが、
     * HUD 要素はすべて teardown の hud.unmount() で片付けられる。
     */
    function makeContainer()
    {
        var el = document.createElement('div');
        document.body.appendChild(el);
        return el;
    }

    /** HUD を片付け、テスト container を DOM から取り除く。 */
    function teardown(container)
    {
        hud.unmount();
        if (container && container.parentNode) { container.parentNode.removeChild(container); }
    }

    /** 最小限の slot 記述子。 */
    function slot(id, renderFn)
    {
        return { id: id, render: renderFn };
    }

    // ── 1. mount は HUD 要素を作る ─────────────────────────────
    t.case('mount creates [data-mitiru-hud] element inside container', function()
    {
        var c = makeContainer();
        hud.mount(c, { slots: [] });
        var el = c.querySelector('[data-mitiru-hud]');
        t.assert(el !== null, 'HUD root element should exist in container');
        teardown(c);
    });

    // ── 2. slot が正しい data-hud-slot 属性で描画される ───
    t.case('mount creates slot elements with data-hud-slot attribute', function()
    {
        var c = makeContainer();
        hud.mount(c, {
            slots: [
                slot('day',   function() { return 'Day 1'; }),
                slot('money', function() { return '¥100'; }),
            ],
        });
        t.assert(c.querySelector('[data-hud-slot="day"]')   !== null, 'day slot');
        t.assert(c.querySelector('[data-hud-slot="money"]') !== null, 'money slot');
        teardown(c);
    });

    // ── 3. 文字列 render → textContent ───────────────────────────
    t.case('string render result is assigned to textContent', function()
    {
        var c = makeContainer();
        hud.mount(c, {
            slots: [ slot('lbl', function() { return 'Hello'; }) ],
        });
        var el = c.querySelector('[data-hud-slot="lbl"]');
        t.assertEq(el.textContent, 'Hello');
        teardown(c);
    });

    // ── 4. Node render → replaceChildren ─────────────────────────
    t.case('Node render result is inserted via replaceChildren', function()
    {
        var c = makeContainer();
        hud.mount(c, {
            slots: [ slot('nodeSlot', function()
            {
                var span = document.createElement('span');
                span.textContent = 'NodeContent';
                return span;
            }) ],
        });
        var slotEl = c.querySelector('[data-hud-slot="nodeSlot"]');
        t.assert(slotEl.querySelector('span') !== null, 'span should be child');
        t.assertEq(slotEl.querySelector('span').textContent, 'NodeContent');
        teardown(c);
    });

    // ── 5. {html} render → innerHTML ─────────────────────────────
    t.case('{html} render result is assigned to innerHTML', function()
    {
        var c = makeContainer();
        hud.mount(c, {
            slots: [ slot('htmlSlot', function()
            {
                return { html: '<b>bold</b>' };
            }) ],
        });
        var slotEl = c.querySelector('[data-hud-slot="htmlSlot"]');
        t.assert(slotEl.querySelector('b') !== null, '<b> tag should be present');
        teardown(c);
    });

    // ── 6. stateKeys の subscription — state 変化で再描画 ────
    t.case('slot rerenders when subscribed state key changes', function()
    {
        s.reset('hud_day');
        s.set('hud_day', 1);
        var c = makeContainer();
        hud.mount(c, {
            stateKeys: ['hud_day'],
            slots: [ slot('day', function(st) { return 'Day ' + st.hud_day; }) ],
        });
        var slotEl = c.querySelector('[data-hud-slot="day"]');
        t.assertEq(slotEl.textContent, 'Day 1', 'initial render');

        s.set('hud_day', 2);
        t.assertEq(slotEl.textContent, 'Day 2', 'after state update');

        s.reset('hud_day');
        teardown(c);
    });

    // ── 7. stateKeys 既定 [] — static snapshot、subscription 無し
    t.case('stateKeys default [] mounts with no subscriptions (static snapshot)', function()
    {
        s.set('hud_static', 'initial');
        var c = makeContainer();
        hud.mount(c, {
            // stateKeys 無し
            slots: [ slot('x', function() { return 'static'; }) ],
        });
        var slotEl = c.querySelector('[data-hud-slot="x"]');
        t.assertEq(slotEl.textContent, 'static');

        // subscription を登録していないので、state 変更は何もしない。
        s.set('hud_static', 'changed');
        t.assertEq(slotEl.textContent, 'static', 'no re-render without subscription');

        s.reset('hud_static');
        teardown(c);
    });

    // ── 8. double-mount 保護 ────────────────────────────────
    t.case('mounting twice unmounts previous instance first', function()
    {
        var c = makeContainer();
        hud.mount(c, { slots: [ slot('a', function() { return 'first'; }) ] });
        var firstRoot = c.querySelector('[data-mitiru-hud]');
        t.assert(firstRoot !== null, 'first root exists');

        hud.mount(c, { slots: [ slot('b', function() { return 'second'; }) ] });
        var roots = c.querySelectorAll('[data-mitiru-hud]');
        t.assertEq(roots.length, 1, 'only one HUD root should exist after re-mount');
        t.assert(roots[0].querySelector('[data-hud-slot="b"]') !== null, 'second slot present');
        t.assertEq(roots[0].querySelector('[data-hud-slot="a"]'), null, 'first slot gone');
        teardown(c);
    });

    // ── 9. unmount は要素を取り除き更新を止める ──────────────
    t.case('unmount removes HUD element and stops state-driven rerenders', function()
    {
        s.set('hud_umount', 10);
        var c = makeContainer();
        hud.mount(c, {
            stateKeys: ['hud_umount'],
            slots: [ slot('v', function(st) { return String(st.hud_umount); }) ],
        });
        var slotEl = c.querySelector('[data-hud-slot="v"]');
        t.assertEq(slotEl.textContent, '10');

        hud.unmount();
        t.assertEq(c.querySelector('[data-mitiru-hud]'), null, 'root removed from DOM');

        // unmount 後の state 変更は throw も、切り離した要素の更新もしてはいけない。
        t.assertNoThrow(function() { s.set('hud_umount', 99); });
        t.assertEq(slotEl.textContent, '10', 'detached slot unchanged after unmount');

        s.reset('hud_umount');
        if (c.parentNode) { c.parentNode.removeChild(c); }
    });

    // ── 10. hud.slots() は live な記述子を返す ──────────────────
    t.case('hud.slots() returns [{id, el}] for each mounted slot', function()
    {
        var c = makeContainer();
        hud.mount(c, {
            slots: [
                slot('alpha', function() { return 'a'; }),
                slot('beta',  function() { return 'b'; }),
            ],
        });
        var ss = hud.slots();
        t.assertEq(ss.length, 2);
        t.assertEq(ss[0].id, 'alpha');
        t.assertEq(ss[1].id, 'beta');
        t.assert(ss[0].el instanceof Element, 'alpha.el is an Element');
        teardown(c);
    });

    // ── 11. mitiru.state 不在時の graceful degrade ─────────────
    t.case('mount works gracefully when mitiru.state is temporarily unavailable', function()
    {
        // F-03 が未読み込みの状態を模擬するため mitiru.state を一時的に隠す。
        var saved = mitiru.state;
        try
        {
            delete mitiru.state;
            var c = makeContainer();
            t.assertNoThrow(function()
            {
                hud.mount(c, {
                    stateKeys: ['missing_key'],
                    slots: [ slot('s', function(st) { return st.missing_key || 'fallback'; }) ],
                });
            });
            var slotEl = c.querySelector('[data-hud-slot="s"]');
            t.assertEq(slotEl.textContent, 'fallback', 'renders fallback without state');
            teardown(c);
        }
        finally
        {
            mitiru.state = saved;
        }
    });

    // ── 12. hud.update() は同期的な再描画を強制 ─────────────
    t.case('hud.update() re-renders all slots from current state', function()
    {
        s.set('hud_update', 'v1');
        var c = makeContainer();
        hud.mount(c, {
            stateKeys: ['hud_update'],
            slots: [ slot('u', function(st) { return st.hud_update; }) ],
        });
        t.assertEq(c.querySelector('[data-hud-slot="u"]').textContent, 'v1');

        // subscriber を起動せず store を直接操作 (通常経路ではないが、
        // update() は現在値を拾うはず)。
        s.set('hud_update', 'v2');  // これは通常 subscription を発火させる
        t.assertEq(c.querySelector('[data-hud-slot="u"]').textContent, 'v2');

        hud.update();               // 明示的に強制
        t.assertEq(c.querySelector('[data-hud-slot="u"]').textContent, 'v2');

        s.reset('hud_update');
        teardown(c);
    });

    // ── 13. mount は不正な container で throw ─────────────────────
    t.case('mount throws Error when container is null or non-element', function()
    {
        t.assertThrow(function() { hud.mount(null, {}); });
        t.assertThrow(function() { hud.mount('not-an-element', {}); });
    });

    // ── run ──────────────────────────────────────────────────────
    mitiru.test.run();
})();
</script>
