<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>@MITIRU_WEB_TITLE@</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#101018}
body{display:flex;align-items:center;justify-content:center}
#canvas{display:block;max-width:100%;max-height:100%;aspect-ratio:@MITIRU_WEB_WIDTH@/@MITIRU_WEB_HEIGHT@;touch-action:none;outline:none}
#status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#d8dce8;font:14px sans-serif;text-align:center;padding:16px;pointer-events:none}
#status.hidden{display:none}
</style>
</head>
<body>
<div id="status">読み込み中...</div>
<canvas id="canvas" tabindex="0"></canvas>
<script>
(function(){
	var status=document.getElementById('status');
	var canvas=document.getElementById('canvas');
	var probe=document.createElement('canvas');
	if(!probe.getContext('webgl2')){
		status.textContent='このブラウザは WebGL2 に対応していないため、遊べません。';
		return;
	}
	window.Module={
		canvas:canvas,
		print:function(t){console.log(t)},
		printErr:function(t){console.error(t)},
		setStatus:function(t){if(t){status.textContent=t}else{status.classList.add('hidden');canvas.focus()}},
		postRun:[function(){status.classList.add('hidden');canvas.focus()}],
		onAbort:function(what){
			status.classList.remove('hidden');
			status.textContent='エラーで止まりました: '+(what||'不明');
		}
	};
	canvas.addEventListener('contextmenu',function(e){e.preventDefault()});
})();
</script>
{{{ SCRIPT }}}
</body>
</html>
