<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- controller body -->
  <rect x="4" y="10" width="24" height="14" rx="6" stroke="currentColor"/>
  <!-- D-pad cross: horizontal bar -->
  <line x1="7" y1="17" x2="13" y2="17"/>
  <!-- D-pad cross: vertical bar -->
  <line x1="10" y1="14" x2="10" y2="20"/>
  <!-- right-side buttons: two dots -->
  <circle cx="21" cy="15" r="1.5" fill="currentColor" stroke="none"/>
  <circle cx="24" cy="18" r="1.5" fill="currentColor" stroke="none"/>
</svg>
