<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- circle background shape -->
  <circle cx="20" cy="20" r="8" fill="currentColor" fill-opacity="0.12" stroke="currentColor"/>
  <!-- triangle overlapping in front -->
  <polygon points="12,4 24,4 6,24" fill="currentColor" fill-opacity="0.18" stroke="currentColor"/>
  <!-- small accent circle -->
  <circle cx="24" cy="10" r="3" fill="currentColor" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
</svg>
