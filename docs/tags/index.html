<script>
  (function () {
    var trigger = document.getElementById('site-search-trigger');
    var dialog  = document.getElementById('site-search-dialog');
    if (!trigger || !dialog) return;

    var mountPoint = dialog.querySelector('#site-search');
    var closers    = dialog.querySelectorAll('[data-search-close]');
    var docEl      = document.documentElement;
    var lang       = (docEl.getAttribute('lang') || 'en').toLowerCase();
    var pagefindBundlePath = "https://mogmog-0110.github.io/MitiruEngine/pagefind/";
    var i18nStrings = {
      placeholder:       "ドキュメントを検索…",
      clear_search:      "クリア",
      load_more:         "さらに読み込む",
      search_label:      "サイト内検索",
      filters_label:     "Filters",
      zero_results:      "「[SEARCH_TERM]」に一致する結果はありません",
      many_results:      "[SEARCH_TERM] の検索結果 [COUNT] 件",
      one_result:        "[SEARCH_TERM] の検索結果 [COUNT] 件",
      alt_search:        "代わりに [DISPLAY_QUERY] の結果を表示しています",
      search_suggestion: "[SEARCH_TERM] の検索結果はありません。[DISPLAY_QUERY] でお試しください",
      searching:         "検索中…"
    };

    var instance = null;
    var lastFocus = null;

    function ensureInstance() {
      if (instance) return instance;
      if (typeof window.PagefindUI !== 'function') return null;
      instance = new window.PagefindUI({
        element:        mountPoint,
        showSubResults: true,
        showImages:     false,
        excerptLength:  30,
        resetStyles:    false,
        bundlePath:     pagefindBundlePath,
        translations:   i18nStrings,
        autofocus:      true
      });
      return instance;
    }

    function openDialog() {
      lastFocus = document.activeElement;
      dialog.hidden = false;
      
      requestAnimationFrame(function () {
        dialog.classList.add('is-open');
        document.body.classList.add('search-open');
        trigger.setAttribute('aria-expanded', 'true');
        ensureInstance();
        var input = dialog.querySelector('.pagefind-ui__search-input');
        if (input) input.focus();
      });
    }

    function closeDialog() {
      dialog.classList.remove('is-open');
      document.body.classList.remove('search-open');
      trigger.setAttribute('aria-expanded', 'false');
      
      setTimeout(function () {
        if (!dialog.classList.contains('is-open')) dialog.hidden = true;
        if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
      }, 200);
    }

    trigger.addEventListener('click', function () {
      if (dialog.classList.contains('is-open')) closeDialog(); else openDialog();
    });

    closers.forEach(function (el) {
      el.addEventListener('click', closeDialog);
    });

    function getTabbable() {
      var panel = dialog.querySelector('.search-dialog__panel');
      if (!panel) return [];
      var sel = 'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
      return Array.prototype.filter.call(panel.querySelectorAll(sel), function (el) {
        return !el.hasAttribute('hidden') && el.offsetParent !== null;
      });
    }

    document.addEventListener('keydown', function (e) {
      var open = dialog.classList.contains('is-open');
      if (e.key === 'Escape' && open) {
        closeDialog();
        return;
      }
      
      
      
      if (e.key === 'Tab' && open) {
        var nodes = getTabbable();
        if (nodes.length === 0) { e.preventDefault(); return; }
        var first = nodes[0], last = nodes[nodes.length - 1];
        var active = document.activeElement;
        if (e.shiftKey && active === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && active === last) {
          e.preventDefault();
          first.focus();
        } else if (!dialog.contains(active)) {
          e.preventDefault();
          first.focus();
        }
        return;
      }
      
      if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
        e.preventDefault();
        if (open) {
          var input = dialog.querySelector('.pagefind-ui__search-input');
          if (input) input.focus();
        } else {
          openDialog();
        }
      }
    });
  })();
</script>

<script>
  (function () {
    var navBox = document.getElementById('nav-toggle');
    var themeBtn = document.getElementById('theme-toggle');

    if (navBox) {
      
      
      
      navBox.addEventListener('change', function () {
        if (navBox.checked) {
          document.body.classList.add('is-nav-open');
        } else {
          document.body.classList.remove('is-nav-open');
        }
      });
    }

    function isDark() {
      var current = document.documentElement.getAttribute('data-theme');
      if (current === 'dark' || current === 'light') return current === 'dark';
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    function syncThemeButton() {
      if (!themeBtn) return;
      themeBtn.setAttribute('aria-pressed', isDark() ? 'true' : 'false');
    }

    
    
    syncThemeButton();

    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        var root = document.documentElement;
        var current = root.getAttribute('data-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var next;
        if (current === 'dark') {
          next = 'light';
        } else if (current === 'light') {
          next = 'dark';
        } else {
          next = prefersDark ? 'light' : 'dark';
        }
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {   }
        syncThemeButton();
      });
    }
  })();
</script>
