<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>hello_game — Mitiru Saturn</title>
    <link rel="stylesheet" href="mitiru_runtime/mitiru_tokens.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <style>
        /* hello_game HUD — Mitiru Saturn (canonical).
           Pure game window: HP / SURVIVE / win-lose modal only.
           Debug/tool chrome lives in inspector sub-windows, never here.
           Tokens are imported above; this file applies them.
           Spec: docs/DESIGN.md (top-level). */

        /* Inline token fallback in case file:// link drops silently. */
        :root {
            --mitiru-bg:        #c8c8c8;
            --mitiru-surface:   #d8d8d8;
            --mitiru-text:      #101010;
            --mitiru-text-mute: #4a4a4a;
            --mitiru-accent:    #c8002c;
            --mitiru-accent-hi: #a30022;
            --mitiru-success:   #4a4a4a;
            --mitiru-danger:    #c8002c;
            --mitiru-border:    #101010;
            --mitiru-border-soft: rgba(16, 16, 16, 0.30);
            --mitiru-font-body: "Arial Narrow", "Helvetica Neue Condensed",
                                "Courier New", "MS Gothic", ui-monospace, monospace;
            --mitiru-font-display: "Press Start 2P", "Arial Narrow",
                                   "Helvetica Neue Condensed", "Courier New", monospace;
            --mitiru-font-prose: "Arial Narrow", "Helvetica Neue Condensed",
                                 "MS Gothic", system-ui, sans-serif;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            color: var(--mitiru-text);
            font-family: var(--mitiru-font-body);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            overflow: hidden;
            pointer-events: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ── Panels (Saturn: bevel chrome + black hairline) ────── */
        .panel {
            position: absolute;
            background: var(--mitiru-surface);
            border: 1px solid var(--mitiru-border);
            border-radius: 0;
            padding: 10px 14px;
            color: var(--mitiru-text);
            box-shadow: inset 2px 2px 0 #ffffff, inset -2px -2px 0 #6a6a6a;
        }

        /* Section caption rule "── HP ──────────" */
        .panel__caption {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--mitiru-text-mute);
            margin: 0 0 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .panel__caption::before { content: "──"; color: var(--mitiru-border); }
        .panel__caption::after  {
            content: "";
            flex: 1;
            border-bottom: 1px solid var(--mitiru-border);
            margin-left: 4px;
            min-width: 12px;
        }

        .panel--hp     { top: 18px; left: 18px;  min-width: 220px; }
        .panel--timer  { top: 18px; right: 18px; min-width: 150px; text-align: left; }

        .value {
            font-family: var(--mitiru-font-display);
            font-size: 22px;
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: 0.02em;
            font-variant-numeric: tabular-nums;
            color: var(--mitiru-text);
        }
        .value .sub {
            font-family: var(--mitiru-font-body);
            font-size: 12px;
            font-weight: 400;
            color: var(--mitiru-text-mute);
            margin-left: 6px;
        }

        /* htop-style block bar — "████████░░░░░░░░" rendered as styled blocks */
        .bar {
            margin-top: 8px;
            font-family: var(--mitiru-font-body);
            font-size: 14px;
            line-height: 1;
            letter-spacing: 0;
            color: var(--mitiru-accent);
            user-select: none;
            white-space: nowrap;
            overflow: hidden;
        }
        .bar__fill {
            color: var(--mitiru-accent);
            transition: color 200ms;
        }
        .bar__empty { color: var(--mitiru-border); }
        .bar--low .bar__fill {
            color: var(--mitiru-danger);
            animation: low-hp-pulse 900ms ease-in-out infinite;
        }
        @keyframes low-hp-pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.55; }
        }

        /* Hit flash — DLL pushes view.hud.hitCount on damage. JS toggles
           .is-hit-flash on .panel--hp for ~180ms → quick scale + tint. */
        .panel--hp.is-hit-flash {
            animation: hit-flash 180ms ease-out;
        }
        @keyframes hit-flash {
            0%   { transform: scale(1);
                   box-shadow: inset 2px 2px 0 #ffffff, inset -2px -2px 0 #6a6a6a,
                               0 0 0 0 rgba(200, 0, 44, 0.0); }
            30%  { transform: scale(1.045);
                   box-shadow: inset 2px 2px 0 #ffffff, inset -2px -2px 0 #6a6a6a,
                               0 0 0 6px rgba(200, 0, 44, 0.32); }
            100% { transform: scale(1);
                   box-shadow: inset 2px 2px 0 #ffffff, inset -2px -2px 0 #6a6a6a,
                               0 0 0 0 rgba(200, 0, 44, 0.0); }
        }

        /* HP value number — slight digit-flip when HP changes */
        .value#hp-value { transition: color 120ms; display: inline-block; }
        .panel--hp.is-hit-flash .value#hp-value { color: var(--mitiru-danger); }

        /* ── Hint dock (bottom-left, no panel chrome) ─────────── */
        .hint {
            position: absolute;
            bottom: 16px;
            left: 18px;
            font-size: 12px;
            color: var(--mitiru-text-mute);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .hint kbd {
            display: inline-block;
            background: var(--mitiru-surface);
            border: 1px solid var(--mitiru-border);
            border-radius: 0;
            padding: 1px 6px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 500;
            color: var(--mitiru-text);
            margin: 0 2px;
            line-height: 1.4;
            box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #6a6a6a;
        }
        .hint__sep { color: var(--mitiru-border); }

        /* ── Game-over modal ────────────────────────────────── */
        .overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(200, 200, 200, 0.78);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            pointer-events: auto;
        }
        .overlay.is-visible { display: flex; }

        .card {
            background: var(--mitiru-surface);
            border: 1px solid var(--mitiru-border);
            border-radius: 0;
            box-shadow: inset 3px 3px 0 #ffffff, inset -3px -3px 0 #6a6a6a,
                        0 6px 0 rgba(0, 0, 0, 0.18);
            padding: 28px 36px;
            text-align: center;
            min-width: 300px;
            animation: card-enter 200ms steps(2, end);
        }
        @keyframes card-enter {
            0%   { transform: translateY(10px) scale(0.96); opacity: 0; }
            100% { transform: translateY(0)    scale(1);    opacity: 1; }
        }
        .card__title {
            font-family: var(--mitiru-font-display);
            font-size: 22px;
            font-weight: 400;
            letter-spacing: 0.04em;
            margin: 0 0 12px;
            color: var(--mitiru-text);
        }
        .card__title--win  { color: var(--mitiru-text); }
        .card__title--lose { color: var(--mitiru-danger); }
        .card__subtitle {
            font-size: 12px;
            color: var(--mitiru-text-mute);
            margin-bottom: 20px;
            font-family: var(--mitiru-font-prose);
        }
        button.restart {
            font-family: var(--mitiru-font-display);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.06em;
            padding: 8px 18px;
            border-radius: 0;
            border: 1px solid var(--mitiru-border);
            background: var(--mitiru-accent);
            color: #ffffff;
            cursor: pointer;
            transition: background 100ms, transform 80ms;
            box-shadow: inset 2px 2px 0 rgba(255,255,255,0.45),
                        inset -2px -2px 0 rgba(0,0,0,0.45);
        }
        button.restart:hover  { background: var(--mitiru-accent-hi); }
        button.restart:active {
            transform: translate(1px, 1px);
            box-shadow: inset -2px -2px 0 rgba(255,255,255,0.45),
                        inset 2px 2px 0 rgba(0,0,0,0.45);
        }

        /* ── Responsive @media (resize-safe) ─────────────────── */
        /* Tablet / narrow window: collapse hint dock to 2 lines, shrink panels */
        @media (max-width: 720px) {
            .panel--hp     { min-width: 180px; padding: 8px 12px; }
            .panel--timer  { min-width: 120px; padding: 8px 12px; }
            .value         { font-size: 20px; }
            .value .sub    { font-size: 11px; }
            .hint {
                flex-wrap: wrap;
                gap: 6px 10px;
                max-width: calc(100vw - 36px);
            }
            .hint__sep     { display: none; } /* let flex-wrap manage gaps */
        }
        /* Phone-narrow / portrait-narrow: stack panel HP / timer vertically */
        @media (max-width: 480px) {
            .panel--hp     { left: 12px; right: 12px; top: 12px; min-width: 0; }
            .panel--timer  { left: 12px; right: 12px; top: auto;
                             top: calc(12px + 90px); min-width: 0; }
            .hint          { left: 12px; right: 12px; font-size: 11px; bottom: 12px; }
        }
        /* Short window (drag from top): hide bottom-only chrome to avoid clip */
        @media (max-height: 320px) {
            .hint         { display: none; }
        }
    </style>
</head>
<body>
    <div class="panel panel--hp">
        <div class="panel__caption">HP</div>
        <div class="value"><span id="hp-value">100</span><span class="sub">/ <span id="hp-max">100</span></span></div>
        <div class="bar" id="hp-bar"><span class="bar__fill" id="hp-fill">████████████████████</span><span class="bar__empty" id="hp-empty"></span></div>
    </div>

    <div class="panel panel--timer">
        <div class="panel__caption">SURVIVE</div>
        <div class="value"><span id="time-value">30</span><span class="sub">sec</span></div>
    </div>

    <div class="hint">
        <span>move <kbd>mouse</kbd> to dodge</span>
        <span class="hint__sep">·</span>
        <span><kbd>ESC</kbd> quit</span>
    </div>

    <div class="overlay" id="overlay">
        <div class="card">
            <h1 class="card__title" id="card-title">GAME OVER</h1>
            <div class="card__subtitle" id="card-subtitle">enemies caught you</div>
            <button class="restart" id="restart-btn">[ Restart ]</button>
        </div>
    </div>

    <script src="mitiru_runtime/mitiru_cef_state.js"></script>
    <script>
        (function () {
            'use strict';

            const $ = (id) => document.getElementById(id);
            const hpValue  = $('hp-value');
            const hpMax    = $('hp-max');
            const hpFill   = $('hp-fill');
            const hpEmpty  = $('hp-empty');
            const hpBar    = $('hp-bar');
            const timeEl   = $('time-value');
            const overlay  = $('overlay');
            const title    = $('card-title');
            const subtitle = $('card-subtitle');
            const button   = $('restart-btn');

            let maxHp = 100;
            const BAR_WIDTH = 20;  // total block count in HP bar

            window.mitiru.onStateChange('view.hud.maxHp', function (v) {
                maxHp = Number(v) || 100;
                hpMax.textContent = String(maxHp);
            });

            window.mitiru.onStateChange('view.hud.hp', function (v) {
                const hp  = Number(v) || 0;
                const pct = Math.max(0, Math.min(1, hp / maxHp));
                const filled = Math.round(pct * BAR_WIDTH);
                hpValue.textContent = String(hp);
                hpFill.textContent  = '█'.repeat(filled);
                hpEmpty.textContent = '░'.repeat(BAR_WIDTH - filled);
                hpBar.classList.toggle('bar--low', pct <= 0.35);
            });

            /* Hit flash — DLL increments view.hud.hitCount on damage.
               JS triggers a one-shot animation on the HP panel.            */
            const hpPanel = document.querySelector('.panel--hp');
            let lastHitCount = 0;
            let hitFlashTimer = 0;
            window.mitiru.onStateChange('view.hud.hitCount', function (v) {
                const c = Number(v) || 0;
                if (c === lastHitCount) { return; }
                lastHitCount = c;
                if (!hpPanel) { return; }
                hpPanel.classList.remove('is-hit-flash');
                void hpPanel.offsetWidth; // restart animation
                hpPanel.classList.add('is-hit-flash');
                if (hitFlashTimer) { clearTimeout(hitFlashTimer); }
                hitFlashTimer = setTimeout(function () {
                    hpPanel.classList.remove('is-hit-flash');
                }, 200);
            });

            window.mitiru.onStateChange('view.hud.time', function (v) {
                timeEl.textContent = String(Math.max(0, Number(v) || 0));
            });

            window.mitiru.onStateChange('view.hud.gameOver', function (v) {
                overlay.classList.toggle('is-visible', Boolean(v));
            });

            window.mitiru.onStateChange('view.hud.outcome', function (v) {
                if (v === 'win') {
                    title.textContent = 'YOU SURVIVED';
                    title.className = 'card__title card__title--win';
                    subtitle.textContent = 'cleared the 30-second run';
                } else if (v === 'lose') {
                    title.textContent = 'GAME OVER';
                    title.className = 'card__title card__title--lose';
                    subtitle.textContent = 'the enemies caught you';
                } else {
                    title.textContent = '';
                    subtitle.textContent = '';
                }
            });

            button.addEventListener('click', function () {
                window.mitiru.dispatch('game.restart').catch(err =>
                    console.error('[hello_game] restart dispatch failed:', err));
            });
        })();
    </script>
</body>
</html>
