<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>showcase_platformer — Mitiru Saturn</title>
    <link rel="stylesheet" href="mitiru_runtime/mitiru_tokens.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <style>
        /* HUD は HTML/CSS のみ (ADR 0007 zero-JS)。gameplay は C++ DLL が描く。
           ここはスコア / 踏みつけ数 / クリア・ゲームオーバーのモーダルだけ。
           debug/tool chrome は inspector sub-window 側 (この窓には出さない)。 */
        :root {
            --mitiru-bg:        #c8c8c8;
            --mitiru-surface:   #d8d8d8;
            --mitiru-text:      #101010;
            --mitiru-text-mute: #4a4a4a;
            --mitiru-accent:    #c8002c;
            --mitiru-accent-hi: #a30022;
            --mitiru-border:    #101010;
            --mitiru-font-body: "Arial Narrow", "Courier New", "MS Gothic", ui-monospace, monospace;
            --mitiru-font-display: "Press Start 2P", "Arial Narrow", "Courier New", monospace;
        }
        html, body {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background: transparent; color: var(--mitiru-text);
            font-family: var(--mitiru-font-body); font-size: 13px;
            font-variant-numeric: tabular-nums; overflow: hidden;
            pointer-events: none;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        }
        .panel {
            position: absolute; top: 18px; left: 18px; min-width: 200px;
            background: var(--mitiru-surface); border: 1px solid var(--mitiru-border);
            padding: 10px 14px; color: var(--mitiru-text);
            box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 #6a6a6a;
        }
        .panel__caption {
            font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
            color: var(--mitiru-text-mute); margin: 0 0 6px;
            display: flex; align-items: center; gap: 6px; white-space: nowrap;
        }
        .panel__caption::before { content: "──"; color: var(--mitiru-border); }
        .panel__caption::after  { content: ""; flex: 1; border-bottom: 1px solid var(--mitiru-border); margin-left: 4px; }
        .row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
        .row + .row { margin-top: 4px; }
        .label { font-size: 12px; color: var(--mitiru-text-mute); }
        .value {
            font-family: var(--mitiru-font-display); font-size: 20px; font-weight: 400;
            letter-spacing: 0.02em; color: var(--mitiru-text); font-variant-numeric: tabular-nums;
        }
        /* 踏みつけ時 flash: DLL が view.hud.stomps を更新 → data-m-flash が .m-flash を付与 */
        .panel.m-flash { animation: stomp-flash 180ms ease-out; }
        @keyframes stomp-flash {
            0%   { box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 #6a6a6a, 0 0 0 0 rgba(200,0,44,0); }
            30%  { box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 #6a6a6a, 0 0 0 6px rgba(200,0,44,0.32); }
            100% { box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 #6a6a6a, 0 0 0 0 rgba(200,0,44,0); }
        }
        .hint {
            position: absolute; bottom: 16px; left: 18px;
            font-size: 12px; color: var(--mitiru-text-mute);
            display: flex; align-items: center; gap: 12px;
        }
        .hint kbd {
            display: inline-block; background: var(--mitiru-surface);
            border: 1px solid var(--mitiru-border); padding: 1px 6px;
            font: inherit; font-size: 11px; color: var(--mitiru-text); margin: 0 2px;
            box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #6a6a6a;
        }
        .hint__sep { color: var(--mitiru-border); }
        .overlay {
            position: absolute; inset: 0; display: none;
            align-items: center; justify-content: center;
            background: rgba(200,200,200,0.78);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            pointer-events: auto;
        }
        .overlay.is-visible { display: flex; }
        .card {
            background: var(--mitiru-surface); border: 1px solid var(--mitiru-border);
            box-shadow: inset 3px 3px 0 #fff, inset -3px -3px 0 #6a6a6a, 0 6px 0 rgba(0,0,0,0.18);
            padding: 28px 36px; text-align: center; min-width: 280px;
        }
        .card__title {
            font-family: var(--mitiru-font-display); font-size: 22px; margin: 0 0 12px;
        }
        .card__title--lose { color: var(--mitiru-danger, #c8002c); }
        .card__subtitle { font-size: 12px; color: var(--mitiru-text-mute); margin-bottom: 20px; }
        button.restart {
            font-family: var(--mitiru-font-display); font-size: 11px; letter-spacing: 0.06em;
            padding: 8px 18px; border: 1px solid var(--mitiru-border);
            background: var(--mitiru-accent); color: #fff; cursor: pointer;
            box-shadow: inset 2px 2px 0 rgba(255,255,255,0.45), inset -2px -2px 0 rgba(0,0,0,0.45);
        }
        button.restart:hover  { background: var(--mitiru-accent-hi); }
        button.restart:active { transform: translate(1px, 1px); }
        @media (max-width: 480px) {
            .panel { left: 12px; right: 12px; min-width: 0; }
            .hint  { left: 12px; right: 12px; bottom: 12px; flex-wrap: wrap; gap: 6px 10px; }
            .hint__sep { display: none; }
        }
        @media (max-height: 320px) { .hint { display: none; } }
    </style>
</head>
<body>
    <div class="panel" data-m-flash="view.hud.stomps">
        <div class="panel__caption">SHOWCASE PLATFORMER</div>
        <div class="row"><span class="label">SCORE</span><span class="value" data-m-text="view.hud.score">0</span></div>
        <div class="row"><span class="label">STOMPS</span><span class="value" data-m-text="view.hud.stomps">0</span></div>
    </div>

    <div class="hint">
        <span>move <kbd>&larr;</kbd><kbd>&rarr;</kbd></span>
        <span class="hint__sep">·</span>
        <span>jump <kbd>&uarr;</kbd></span>
        <span class="hint__sep">·</span>
        <span><kbd>R</kbd> restart</span>
        <span class="hint__sep">·</span>
        <span><kbd>ESC</kbd> quit</span>
    </div>

    <div class="overlay" data-m-class="is-visible: view.hud.over">
        <div class="card">
            <h1 class="card__title"       data-m-show="view.hud.outcome == win">GOAL!</h1>
            <h1 class="card__title card__title--lose" data-m-show="view.hud.outcome == lose">GAME OVER</h1>
            <div class="card__subtitle"   data-m-show="view.hud.outcome == win">reached the flag</div>
            <div class="card__subtitle"   data-m-show="view.hud.outcome == lose">caught by an enemy</div>
            <button class="restart" data-m-action="game.restart">[ Restart ]</button>
        </div>
    </div>

    <!-- bridge transport + 宣言バインダ (engine runtime、game コードではない)。
         showcase_platformer 自体は手書き JS をゼロ行しか持たない (ADR 0007)。 -->
    <script src="mitiru_runtime/mitiru_cef_state.js"></script>
    <script src="mitiru_runtime/mitiru_bind.js"></script>
</body>
</html>
