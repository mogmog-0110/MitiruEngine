<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>scene tree</title>
<link rel="stylesheet" href="tool.css">
<style>
  .tree{ margin-top:8px; padding:8px 10px; background:#fff; box-shadow:var(--sink);
         font:400 14px/1.0 "Consolas",ui-monospace,"Courier New",monospace; }
  .row{ display:flex; align-items:center; height:24px; white-space:nowrap; }
  /* インデント + 点線コネクタ (Win95 Explorer 風) */
  .indent{ width:18px; height:24px; flex:0 0 18px; }
  .indent.line{ background-image:linear-gradient(#b8b8b8 1px, transparent 1px);
                background-size:1px 2px; background-position:9px 0; background-repeat:repeat-y; }
  /* [+]/[-] 開閉ボックス */
  .tog{ width:15px; height:15px; flex:0 0 15px; margin-right:5px; cursor:pointer;
        display:flex; align-items:center; justify-content:center;
        background:#fff; border:1px solid #808080; font-size:11px; line-height:1; color:#000;
        font-family:monospace; user-select:none; }
  .tog.leaf{ border:0; background:transparent; cursor:default; }
  .key{ color:#000; font-weight:700; }
  .colon{ color:#888; margin:0 5px; }
  .val{ color:#000080; font-weight:700; }
  .obj-hint{ color:#888; margin-left:7px; font-weight:400; }
  .children.collapsed{ display:none; }
</style>
</head>
<body class="is-waiting">
  <header><span class="dot"></span><h1>scene tree</h1></header>
  <div class="body"><div class="tree" id="t"></div></div>
  <div class="wait">waiting for the game…</div>

<script>
  const collapsed = new Set();   // 明示的に閉じた path (既定は展開)
  let lastJson = '';
  function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  function rowHtml(key, node, depth, path){
    const isContainer = node && typeof node==='object';
    const arr = Array.isArray(node);
    let indents='';
    for(let i=0;i<depth;i++) indents += '<span class="indent line"></span>';
    if(isContainer){
      const open = !collapsed.has(path);
      const n = arr ? node.length : Object.keys(node).length;
      const hint = n ? `<span class="obj-hint">${arr?n+' items':n+' keys'}</span>` : '';
      let html = `<div class="row">${indents}<span class="tog" data-p="${esc(path)}">${open?'-':'+'}</span><span class="key">${esc(key)}</span>${hint}</div>`;
      html += `<div class="children${open?'':' collapsed'}">`;
      const entries = arr ? node.map((v,i)=>['['+i+']',v]) : Object.entries(node);
      for(const [k,v] of entries) html += rowHtml(k, v, depth+1, path+'/'+k);
      html += `</div>`;
      return html;
    }
    return `<div class="row">${indents}<span class="tog leaf"></span><span class="key">${esc(key)}</span><span class="colon">:</span><span class="val">${esc(node)}</span></div>`;
  }

  function rebuild(snap){
    const host = document.getElementById('t');
    host.innerHTML = rowHtml('scene', snap, 0, 'scene');
    host.querySelectorAll('.tog:not(.leaf)').forEach(el=>{
      el.addEventListener('click', ()=>{
        const p = el.getAttribute('data-p');
        if(collapsed.has(p)) collapsed.delete(p); else collapsed.add(p);
        rebuild(snap);  // 同じ snap で再描画 (展開状態は collapsed Set が保持)
      });
    });
  }

  window.applySnapshot=function(env){
    const snap = env && env.snap;
    const ok = env && env.ready && snap && Object.keys(snap).length;
    document.body.classList.toggle('is-waiting', !ok);
    if(!ok) return;
    const j = JSON.stringify(snap);
    if(j === lastJson) return;   // 構造が変わらなければ再描画しない (開閉状態を守る)
    lastJson = j;
    rebuild(snap);
  };
</script>
</body>
</html>
