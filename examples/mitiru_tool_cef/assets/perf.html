<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>perf</title>
<link rel="stylesheet" href="tool.css">
<style>
  .fps{ margin-top:22px; font-size:54px; font-weight:600; letter-spacing:-1px; line-height:1;
        font-variant-numeric:tabular-nums; }
  .fps small{ font-size:20px; font-weight:500; color:var(--muted); margin-left:8px; }
  .ms{ margin-top:8px; font-size:16px; color:var(--muted); font-variant-numeric:tabular-nums; }
  canvas{ display:block; width:100%; height:150px; }
</style>
</head>
<body class="is-waiting">
  <header><span class="dot"></span><h1>perf</h1></header>
  <div class="body">
    <div class="fps"><span id="fps">--</span><small>fps</small></div>
    <div class="ms"><span id="ms">--</span> ms / frame</div>
    <div class="label">fps history · newest right</div>
    <div class="panel"><canvas id="g" width="320" height="150"></canvas></div>
  </div>
  <div class="wait">waiting for the game…</div>

<script>
  const hist=[], CAP=180;
  function draw(){
    const c=document.getElementById('g'), dpr=devicePixelRatio||1;
    const w=c.clientWidth,h=c.clientHeight; c.width=w*dpr; c.height=h*dpr;
    const x=c.getContext('2d'); x.scale(dpr,dpr); x.clearRect(0,0,w,h);
    let mx=75; for(const v of hist) mx=Math.max(mx,v*1.1);
    const by=h-(60/mx)*h;
    x.strokeStyle='#e6e7ea'; x.lineWidth=1; x.beginPath(); x.moveTo(0,by); x.lineTo(w,by); x.stroke();
    x.fillStyle='#999da4'; x.font="12px 'IBM Plex Mono','Consolas',monospace"; x.fillText('60',w-22,by-6);
    if(hist.length>=2){
      x.strokeStyle='#1a1c1f'; x.lineWidth=2; x.lineJoin='round'; x.beginPath();
      for(let i=0;i<hist.length;i++){ const px=w*i/(CAP-1), py=h-(hist[i]/mx)*h; i?x.lineTo(px,py):x.moveTo(px,py); }
      x.stroke();
    }
  }
  window.applySnapshot=function(env){
    const st = env && env.snap && env.snap.perf && env.snap.perf.state;
    document.body.classList.toggle('is-waiting', !(env && env.ready && st));
    if(!st) return;
    document.getElementById('fps').textContent = st.fps ?? '--';
    document.getElementById('ms').textContent  = (st.frameMs ?? 0).toFixed(2);
    hist.push(st.fps||0); while(hist.length>CAP) hist.shift();
    draw();
  };
  addEventListener('resize', draw); draw();
</script>
</body>
</html>
