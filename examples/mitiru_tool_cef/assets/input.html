<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>input</title>
<link rel="stylesheet" href="tool.css">
</head>
<body class="is-waiting">
  <header><span class="dot"></span><h1>input</h1></header>
  <div class="body" id="b"></div>
  <div class="wait">waiting for the game…</div>

<script>
  // input 専用ビュー: snapshot の "input" セクションだけを描く (InputMonitor 後継)。
  function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function val(v){
    if(v===null) return 'null';
    if(Array.isArray(v)) return '[ ' + v.map(esc).join(', ') + ' ]';
    if(typeof v==='object'){
      return Object.entries(v).map(function(e){
        return esc(e[0]) + ' ' + (e[1]!==null && typeof e[1]==='object' ? '…' : esc(e[1]));
      }).join('  ·  ');
    }
    return esc(v);
  }
  window.applySnapshot=function(env){
    const snap = env && env.snap;
    const entry = snap && snap.input;
    document.body.classList.toggle('is-waiting', !(env && env.ready && entry));
    if(!entry){ document.getElementById('b').innerHTML=''; return; }
    const title = entry.title || 'input';
    const state = (typeof entry.state==='object') ? entry.state : entry;
    let html = `<div class="section-title">${esc(title)}</div><div class="kv">`;
    if(state && typeof state==='object' && !Array.isArray(state)){
      for(const [k,v] of Object.entries(state))
        html += `<div class="row"><span class="k">${esc(k)}</span><span class="v">${val(v)}</span></div>`;
    } else {
      html += `<div class="row"><span class="v">${val(state)}</span></div>`;
    }
    html += `</div>`;
    document.getElementById('b').innerHTML = html;
  };
</script>
</body>
</html>
