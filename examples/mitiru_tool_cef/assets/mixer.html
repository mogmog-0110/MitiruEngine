<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mixer</title>
<link rel="stylesheet" href="tool.css">
<style>
  /* メーター表示 — テクニカルノートテーマ (完全グレースケール。レベルは濃淡で表現) */
  .master{ display:flex; align-items:flex-end; gap:16px; margin-top:14px; }
  .fader{ width:46px; height:200px; background:#ffffff; border:1px solid #e6e7ea; box-shadow:none;
          position:relative; overflow:hidden; }
  .fader .fill{ position:absolute; left:2px; right:2px; bottom:2px; background:#1a1c1f; }
  .pct{ font-family:'IBM Plex Mono','Consolas',monospace; font-size:28px; font-weight:600;
        color:#1a1c1f; font-variant-numeric:tabular-nums; }
  .vu{ display:flex; gap:12px; margin-top:8px; }
  .ch{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .ch .bar{ width:24px; height:200px; background:#f4f4f2; border:1px solid #e6e7ea; box-shadow:none;
            position:relative; overflow:hidden; }
  .ch .bar .fill{ position:absolute; left:2px; right:2px; bottom:2px; background:#1a1c1f; }
  .ch .tag{ font-family:'IBM Plex Mono','Consolas',monospace; font-size:13px; color:#999da4; }
  .cols{ display:flex; gap:40px; margin-top:14px; align-items:flex-start; }
</style>
</head>
<body class="is-waiting">
  <header><span class="dot"></span><h1>mixer</h1></header>
  <div class="body">
    <div class="cols">
      <div>
        <div class="label" style="margin-top:0">master</div>
        <div class="master">
          <div class="fader"><div class="fill" id="mfill"></div></div>
          <div class="pct"><span id="mpct">--</span>%</div>
        </div>
        <div class="muted" style="margin-top:14px">engine: <span id="eng">—</span></div>
      </div>
      <div>
        <div class="label" style="margin-top:0">channels · VU</div>
        <div class="vu" id="vu"></div>
        <div class="muted" id="silent" style="margin-top:10px; display:none">(silent)</div>
      </div>
    </div>
  </div>
  <div class="wait">waiting for the game…</div>

<script>
  window.applySnapshot=function(env){
    const st = env && env.snap && env.snap.audio && env.snap.audio.state;
    document.body.classList.toggle('is-waiting', !(env && env.ready && st));
    if(!st) return;
    const m = Math.max(0,Math.min(1, st.masterVolume ?? 0));
    document.getElementById('mfill').style.height = (m*100)+'%';
    document.getElementById('mpct').textContent = Math.round(m*100);
    document.getElementById('eng').textContent = st.engine || 'none';
    const vu = document.getElementById('vu');
    const chans = Array.isArray(st.channels) ? st.channels : [];
    document.getElementById('silent').style.display = chans.length ? 'none' : 'block';
    vu.innerHTML = chans.map(ch=>{
      const lv = Math.max(0,Math.min(1, ch.level ?? 0));
      const music = ch.kind === 'music';
      const col = music ? '#1a1c1f' : '#6e7077';
      return `<div class="ch"><div class="bar"><div class="fill" style="height:${lv*100}%;background:${col}"></div></div><div class="tag">${music?'M':'S'}</div></div>`;
    }).join('');
  };
</script>
</body>
</html>
