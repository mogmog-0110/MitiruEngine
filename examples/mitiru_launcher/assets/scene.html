<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>MitiruEngine Launcher — Saturn</title>
    <link rel="stylesheet" href="mitiru_runtime/mitiru_tokens.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <style>
        /* Launcher — Mitiru Saturn (canonical).
           Tokens imported above; this file applies them.
           Spec: docs/DESIGN.md (top-level). */

        /* Inline token fallback for CEF file:// resolution edge cases. */
        :root {
            --mitiru-bg:        #c8c8c8;
            --mitiru-surface:   #d8d8d8;
            --mitiru-surface-2: #c0c0c0;
            --mitiru-text:      #101010;
            --mitiru-text-mute: #4a4a4a;
            --mitiru-accent:    #c8002c;
            --mitiru-accent-hi: #a30022;
            --mitiru-success:   #4a4a4a;
            --mitiru-danger:    #c8002c;
            --mitiru-border:    #101010;
            --mitiru-border-soft: rgba(16, 16, 16, 0.30);
            --mitiru-font-body: "Arial Narrow", "Helvetica Neue Condensed",
                                "Courier New", "MS Gothic", ui-monospace, monospace;
            --mitiru-font-display: "Press Start 2P", "Arial Narrow",
                                   "Helvetica Neue Condensed", "Courier New", monospace;
            --mitiru-font-prose: "Arial Narrow", "Helvetica Neue Condensed",
                                 "MS Gothic", system-ui, sans-serif;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: var(--mitiru-bg);
            color: var(--mitiru-text);
            font-family: var(--mitiru-font-body);
            font-size: 13px;
            line-height: 1.45;
            font-variant-numeric: tabular-nums;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 14px;
            padding: 14px 18px 18px;
            box-sizing: border-box;
        }

        /* ── Header ──────────────────────────────────────────── */
        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--mitiru-border);
        }
        header h1 {
            margin: 0;
            font-family: var(--mitiru-font-display);
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.02em;
        }
        header h1 .accent { color: var(--mitiru-accent); }
        header .tag {
            font-size: 11px;
            font-weight: 500;
            color: var(--mitiru-text-mute);
        }

        /* ── Main grid ──────────────────────────────────────── */
        main {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
            gap: 14px;
            min-height: 0;
        }
        @media (max-width: 720px) {
            main { grid-template-columns: 1fr; }
        }

        .section {
            background: var(--mitiru-surface);
            border: 1px solid var(--mitiru-border);
            border-radius: 0;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            box-shadow: inset 2px 2px 0 #ffffff, inset -2px -2px 0 #6a6a6a;
        }

        /* Section caption: "── PROJECTS ───────── (2)"  */
        .section h2 {
            margin: 0 0 12px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--mitiru-text-mute);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .section h2::before { content: "──"; color: var(--mitiru-border); }
        .section h2::after  {
            content: "";
            flex: 1;
            border-bottom: 1px solid var(--mitiru-border);
            margin-left: 4px;
        }
        .section h2 .count {
            font-weight: 400;
            color: var(--mitiru-text-mute);
            margin-left: 4px;
        }

        .section .scroll {
            overflow-y: auto;
            margin: -4px;
            padding: 4px;
            flex: 1;
        }
        .section .scroll::-webkit-scrollbar { width: 6px; }
        .section .scroll::-webkit-scrollbar-thumb {
            background: var(--mitiru-border);
            border-radius: 3px;
        }

        /* ── Project rows ──────────────────────────────────── */
        .project {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 6px 12px;
            align-items: center;
            padding: 8px 12px;
            border-radius: 0;
            background: transparent;
            margin-bottom: 4px;
            border: 1px solid transparent;
            border-left: 2px solid transparent;
            transition: background 100ms, border-color 100ms;
        }
        .project:hover {
            background: var(--mitiru-surface-2);
            border-left-color: var(--mitiru-accent);
        }
        @media (max-width: 600px) {
            .project { grid-template-columns: 1fr; }
            .project__actions { justify-content: flex-start; }
        }

        .project__meta { min-width: 0; }
        .project__name {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0;
        }
        .project__name .running-pill {
            margin-left: 8px;
            display: inline-block;
            padding: 0 7px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.06em;
            border-radius: 9999px;
            vertical-align: middle;
            line-height: 1.4;
        }
        .project__name .running-pill.run   {
            background: var(--mitiru-accent);
            color: #ffffff;
        }
        .project__name .running-pill.watch {
            background: var(--mitiru-accent);
            color: #ffffff;
        }
        .project__path {
            font-size: 11px;
            color: var(--mitiru-text-mute);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .project__actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        button.action {
            font-family: inherit;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0;
            padding: 5px 12px;
            border-radius: 0;
            border: 1px solid var(--mitiru-border);
            background: var(--mitiru-surface);
            color: var(--mitiru-text);
            cursor: pointer;
            transition: background 100ms;
            box-shadow: inset 2px 2px 0 #ffffff, inset -2px -2px 0 #6a6a6a;
        }
        button.action:hover  { background: var(--mitiru-surface-2); }
        button.action:active {
            box-shadow: inset -2px -2px 0 #ffffff, inset 2px 2px 0 #6a6a6a;
        }
        button.action.icon   { padding: 4px 7px; font-size: 12px; }

        button.action.open {
            color: #ffffff;
            border-color: var(--mitiru-border);
            background: var(--mitiru-accent);
            font-weight: 600;
            padding: 6px 14px;
            box-shadow: inset 2px 2px 0 rgba(255,255,255,0.45),
                        inset -2px -2px 0 rgba(0,0,0,0.45);
        }
        button.action.open:hover  { background: var(--mitiru-accent-hi); }

        button.action.danger {
            color: var(--mitiru-danger);
            border-color: var(--mitiru-border);
        }
        button.action.danger:hover { background: rgba(200, 0, 44, 0.10); }

        button.action[disabled],
        button.action[disabled]:hover {
            opacity: 0.32;
            cursor: not-allowed;
            background: var(--mitiru-surface);
        }

        .empty {
            padding: 20px 14px;
            text-align: center;
            color: var(--mitiru-text-mute);
            font-size: 12px;
        }
        .empty .hint {
            display: block;
            margin-top: 4px;
            font-size: 11px;
            color: var(--mitiru-text-mute);
            opacity: 0.7;
        }

        .add-zone {
            margin-top: 8px;
            padding: 10px;
            border: 1px dashed var(--mitiru-border);
            border-radius: 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        button.add {
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 0;
            border: 1px solid var(--mitiru-border);
            background: var(--mitiru-accent);
            color: #ffffff;
            cursor: pointer;
            transition: background 100ms;
            box-shadow: inset 2px 2px 0 rgba(255,255,255,0.45),
                        inset -2px -2px 0 rgba(0,0,0,0.45);
        }
        button.add:hover { background: var(--mitiru-accent-hi); }
        button.add.secondary {
            border-color: var(--mitiru-border);
            background: var(--mitiru-surface);
            color: var(--mitiru-text);
            box-shadow: inset 2px 2px 0 #ffffff, inset -2px -2px 0 #6a6a6a;
        }
        button.add.secondary:hover { background: var(--mitiru-surface-2); }
        button.add[disabled] {
            opacity: 0.32; cursor: not-allowed;
            background: var(--mitiru-surface);
            border-color: var(--mitiru-border); color: var(--mitiru-text-mute);
        }

        /* ── Flash toast ──────────────────────────────────── */
        .flash {
            position: fixed; left: 18px; right: 18px; bottom: 14px;
            padding: 8px 14px; border-radius: 0;
            font-size: 12px; text-align: center;
            background: var(--mitiru-surface);
            border: 1px solid var(--mitiru-border);
            border-left-width: 3px;
            opacity: 0; transform: translateY(6px);
            transition: opacity 200ms, transform 200ms;
            pointer-events: none;
            box-shadow: inset 2px 2px 0 #ffffff, inset -2px -2px 0 #6a6a6a;
        }
        .flash.is-visible { opacity: 1; transform: translateY(0); }
        .flash.kind-ok    { color: var(--mitiru-text);    border-left-color: var(--mitiru-text); }
        .flash.kind-error { color: var(--mitiru-danger);  border-left-color: var(--mitiru-danger); }
        .flash.kind-info  { color: var(--mitiru-accent);  border-left-color: var(--mitiru-accent); }

        /* ── Modal ────────────────────────────────────────── */
        .modal {
            display: none;
            position: fixed; inset: 0; z-index: 1000;
            align-items: center; justify-content: center;
        }
        .modal.is-visible { display: flex; }
        .modal__backdrop {
            position: absolute; inset: 0;
            background: rgba(200, 200, 200, 0.78);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .modal__card {
            position: relative; z-index: 1;
            background: var(--mitiru-surface);
            padding: 18px 20px;
            border: 1px solid var(--mitiru-border);
            border-radius: 0;
            width: min(440px, calc(100vw - 64px));
            box-shadow: inset 3px 3px 0 #ffffff, inset -3px -3px 0 #6a6a6a,
                        0 6px 0 rgba(0, 0, 0, 0.18);
        }
        .modal__title {
            font-family: var(--mitiru-font-display);
            font-size: 12px;
            font-weight: 400;
            margin-bottom: 10px;
            letter-spacing: 0.04em;
        }
        .modal__message {
            font-size: 12px;
            color: var(--mitiru-text-mute);
            margin-bottom: 14px;
            line-height: 1.5;
            font-family: var(--mitiru-font-prose);
        }
        .modal__input-row {
            display: flex;
            gap: 6px;
            align-items: stretch;
            margin-bottom: 12px;
        }
        .modal__input {
            flex: 1; min-width: 0; box-sizing: border-box;
            background: #ffffff;
            border: 1px solid var(--mitiru-border);
            border-radius: 0;
            padding: 8px 10px;
            color: var(--mitiru-text);
            font-family: var(--mitiru-font-body);
            font-size: 13px;
            box-shadow: inset 2px 2px 0 #6a6a6a, inset -2px -2px 0 #ffffff;
        }
        .modal__input:focus {
            outline: none;
            border-color: var(--mitiru-accent);
            box-shadow: inset 2px 2px 0 #6a6a6a, inset -2px -2px 0 #ffffff,
                        0 0 0 2px var(--mitiru-accent);
        }
        .modal__actions {
            display: flex; justify-content: flex-end; gap: 8px;
        }
        .modal__btn {
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            padding: 6px 16px;
            border-radius: 0;
            border: 1px solid var(--mitiru-border);
            background: var(--mitiru-surface);
            color: var(--mitiru-text);
            cursor: pointer;
            transition: background 100ms;
            box-shadow: inset 2px 2px 0 #ffffff, inset -2px -2px 0 #6a6a6a;
        }
        .modal__btn:hover { background: var(--mitiru-surface-2); }
        .modal__btn:active {
            box-shadow: inset -2px -2px 0 #ffffff, inset 2px 2px 0 #6a6a6a;
        }
        .modal__btn.modal__ok {
            color: #ffffff;
            border-color: var(--mitiru-border);
            background: var(--mitiru-accent);
            font-weight: 600;
            box-shadow: inset 2px 2px 0 rgba(255,255,255,0.45),
                        inset -2px -2px 0 rgba(0,0,0,0.45);
        }
        .modal__btn.modal__ok:hover { background: var(--mitiru-accent-hi); }

        /* ── Recent runs ──────────────────────────────────── */
        .recent {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 0;
            background: transparent;
            margin-bottom: 3px;
            font-size: 12px;
            border-left: 2px solid transparent;
        }
        .recent:hover { background: var(--mitiru-surface-2); }
        .recent__name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .recent__name .mode {
            margin-left: 4px;
            font-size: 10px;
            color: var(--mitiru-text-mute);
        }
        .recent__status {
            flex-shrink: 0;
            font-size: 11px;
            color: var(--mitiru-text-mute);
        }
        .recent__status.ok  { color: var(--mitiru-text); }
        .recent__status.bad { color: var(--mitiru-danger); }
        .recent__time {
            flex-shrink: 0;
            color: var(--mitiru-text-mute);
            font-size: 11px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <header>
        <h1>Mitiru<span class="accent">Engine</span> &mdash; Launcher</h1>
        <span class="tag">v0.2.0</span>
    </header>

    <main>
        <section class="section section--projects">
            <h2>Projects <span class="count" id="projects-count">(0)</span></h2>
            <div class="scroll" id="projects-list">
                <!-- populated by view.launcher.projects -->
            </div>
            <div class="add-zone">
                <button class="add" id="new-project" title="Scaffold a new project under examples/ (engine source required)">+ New project</button>
                <button class="add secondary" id="add-project" title="Register an already-built DLL">+ Add existing .dll</button>
            </div>
        </section>

        <section class="section section--recents">
            <h2>Recent runs</h2>
            <div class="scroll" id="recents-list">
                <!-- populated by view.launcher.recents -->
            </div>
        </section>
    </main>

    <div class="flash" id="flash"></div>

    <div class="modal" id="modal">
        <div class="modal__backdrop" id="modal-backdrop"></div>
        <div class="modal__card">
            <div class="modal__title" id="modal-title"></div>
            <div class="modal__message" id="modal-message"></div>
            <div class="modal__input-row" id="modal-input-row">
                <input class="modal__input" id="modal-input" type="text" autocomplete="off" spellcheck="false">
            </div>
            <div class="modal__actions">
                <button class="modal__btn" id="modal-cancel">Cancel</button>
                <button class="modal__btn modal__ok" id="modal-ok">OK</button>
            </div>
        </div>
    </div>

    <script src="mitiru_runtime/mitiru_cef_state.js"></script>
    <script>
        (function () {
            const projectsList = document.getElementById('projects-list');
            const projectsCount = document.getElementById('projects-count');
            const recentsList   = document.getElementById('recents-list');
            const addBtn        = document.getElementById('add-project');
            const newBtn        = document.getElementById('new-project');
            const flashEl       = document.getElementById('flash');
            const modalEl       = document.getElementById('modal');
            const modalTitleEl  = document.getElementById('modal-title');
            const modalMsgEl    = document.getElementById('modal-message');
            const modalInputRow = document.getElementById('modal-input-row');
            const modalInputEl  = document.getElementById('modal-input');
            const modalOkBtn    = document.getElementById('modal-ok');
            const modalCancelBtn= document.getElementById('modal-cancel');
            const modalBackdrop = document.getElementById('modal-backdrop');
            let env = {canScaffold: false, vcvarsFound: false};

            // ── In-page modal helper (CEF OSR has no parent HWND for native dialogs) ──
            let modalResolver = null;
            let modalMode = 'confirm';
            function closeModal(value) {
                modalEl.classList.remove('is-visible');
                if (modalResolver) {
                    const r = modalResolver;
                    modalResolver = null;
                    r(value);
                }
            }
            modalOkBtn.addEventListener('click', () => {
                closeModal(modalMode === 'prompt' ? modalInputEl.value : true);
            });
            modalCancelBtn.addEventListener('click', () => {
                closeModal(modalMode === 'prompt' ? null : false);
            });
            modalBackdrop.addEventListener('click', () => {
                closeModal(modalMode === 'prompt' ? null : false);
            });
            function insertAtCursor(ch) {
                const s = modalInputEl.selectionStart;
                const e = modalInputEl.selectionEnd;
                const v = modalInputEl.value;
                modalInputEl.value = v.slice(0, s) + ch + v.slice(e);
                modalInputEl.setSelectionRange(s + ch.length, s + ch.length);
                modalInputEl.dispatchEvent(new Event('input', {bubbles: true}));
            }
            modalInputEl.addEventListener('keydown', (ev) => {
                if (ev.key === 'Enter')   { ev.preventDefault(); modalOkBtn.click(); return; }
                if (ev.key === 'Escape')  { ev.preventDefault(); modalCancelBtn.click(); return; }
                if (ev.key === '_' || ev.key === '-') {
                    ev.preventDefault();
                    insertAtCursor('_');
                }
            });
            modalInputEl.addEventListener('input', () => {
                const before = modalInputEl.value;
                const cursor = modalInputEl.selectionStart;
                const after  = before
                    .toLowerCase()
                    .replace(/-/g, '_')
                    .replace(/[^a-z0-9_]/g, '');
                if (after !== before) {
                    modalInputEl.value = after;
                    const newCursor = Math.min(cursor, after.length);
                    modalInputEl.setSelectionRange(newCursor, newCursor);
                }
            });
            window.addEventListener('focus', () => {
                if (!modalEl.classList.contains('is-visible')) return;
                if (modalMode === 'prompt') { modalInputEl.focus(); }
                else                        { modalOkBtn.focus(); }
            });
            setInterval(() => {
                if (!modalEl.classList.contains('is-visible')) return;
                if (modalMode !== 'prompt') return;
                if (document.activeElement !== modalInputEl) {
                    modalInputEl.focus();
                }
            }, 200);
            document.addEventListener('keydown', (ev) => {
                if (!modalEl.classList.contains('is-visible')) return;
                if (ev.key === 'Escape')                       { closeModal(modalMode === 'prompt' ? null : false); }
                else if (ev.key === 'Enter' && modalMode === 'confirm') { closeModal(true); }
            });

            function modalPrompt(title, defaultValue, message) {
                return new Promise(resolve => {
                    modalResolver = resolve;
                    modalMode = 'prompt';
                    modalTitleEl.textContent = title;
                    modalMsgEl.textContent   = message || '';
                    modalMsgEl.style.display = message ? 'block' : 'none';
                    modalInputRow.style.display = 'flex';
                    modalInputEl.value = defaultValue || '';
                    modalEl.classList.add('is-visible');
                    setTimeout(() => { modalInputEl.focus(); modalInputEl.select(); }, 40);
                });
            }
            function modalConfirm(title, message) {
                return new Promise(resolve => {
                    modalResolver = resolve;
                    modalMode = 'confirm';
                    modalTitleEl.textContent = title;
                    modalMsgEl.textContent   = message || '';
                    modalMsgEl.style.display = message ? 'block' : 'none';
                    modalInputRow.style.display = 'none';
                    modalEl.classList.add('is-visible');
                    setTimeout(() => modalOkBtn.focus(), 40);
                });
            }

            function esc(s) {
                return String(s).replace(/[&<>"]/g, c =>
                    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
            }

            function renderProjects(list) {
                projectsCount.textContent = '(' + list.length + ')';
                if (list.length === 0) {
                    projectsList.innerHTML =
                        '<div class="empty">no projects yet' +
                        '<span class="hint">add a game DLL with the button below</span></div>';
                    return;
                }
                projectsList.innerHTML = list.map(p => {
                    let pills = '';
                    if (p.runningRun || p.runningWatch) {
                        pills += '<span class="running-pill watch">LIVE</span>';
                    }
                    return (
                        '<div class="project">' +
                          '<div class="project__meta">' +
                            '<div class="project__name">' + esc(p.name) + pills + '</div>' +
                            '<div class="project__path" title="' + esc(p.dllPath) + '">' +
                              esc(p.dllPath) + '</div>' +
                          '</div>' +
                          '<div class="project__actions">' +
                            '<button class="action open"       data-act="open"        data-idx="' + p.index + '" ' +
                              'title="Launch the game with hot reload + attach the dev companion bar">▶ Open</button>' +
                            '<button class="action icon"       data-act="open_folder" data-idx="' + p.index + '" title="Open project folder in Explorer">📁</button>' +
                            '<button class="action icon danger" data-act="remove"     data-idx="' + p.index + '" title="Remove from this list (DLL file stays on disk)">✕</button>' +
                          '</div>' +
                        '</div>'
                    );
                }).join('');
            }

            function relTime(unix) {
                if (!unix) return '';
                const now = Math.floor(Date.now() / 1000);
                const d = now - unix;
                if (d < 60)        return d + 's ago';
                if (d < 3600)      return Math.floor(d / 60) + 'm ago';
                if (d < 86400)     return Math.floor(d / 3600) + 'h ago';
                return Math.floor(d / 86400) + 'd ago';
            }

            function renderRecents(list) {
                if (!list || list.length === 0) {
                    recentsList.innerHTML = '<div class="empty">no runs yet</div>';
                    return;
                }
                recentsList.innerHTML = list.map(r => {
                    const ok = (r.exitCode === 0);
                    const statusClass = ok ? 'ok' : 'bad';
                    const statusText  = ok ? 'exit 0' : ('exit ' + r.exitCode);
                    const mode = r.watching ? 'watch' : 'run';
                    return (
                        '<div class="recent">' +
                          '<div class="recent__name">' + esc(r.projectName) +
                            '<span class="mode">[' + mode + ']</span></div>' +
                          '<div class="recent__status ' + statusClass + '">' + statusText + '</div>' +
                          '<div class="recent__time">' + relTime(r.endedAt) + '</div>' +
                        '</div>'
                    );
                }).join('');
            }

            // ── State subscriptions ──────────────────────────
            let lastProjectsJson = null;
            let lastRecentsJson  = null;
            let lastEnvJson      = null;
            let lastFlashJson    = null;
            window.mitiru.onStateChange('view.launcher.projects', json => {
                if (json === lastProjectsJson) return;
                lastProjectsJson = json;
                try { renderProjects(JSON.parse(json)); }
                catch (e) { console.error('projects parse', e); }
            });
            window.mitiru.onStateChange('view.launcher.recents', json => {
                if (json === lastRecentsJson) return;
                lastRecentsJson = json;
                try { renderRecents(JSON.parse(json)); }
                catch (e) { console.error('recents parse', e); }
            });
            window.mitiru.onStateChange('view.launcher.env', json => {
                if (json === lastEnvJson) return;
                lastEnvJson = json;
                try {
                    env = JSON.parse(json);
                    newBtn.disabled = !env.canScaffold;
                    if (!env.canScaffold) {
                        newBtn.title = 'Scaffolding requires engine source (clone the dev repo). Disabled in this install.';
                    }
                } catch (e) { console.error('env parse', e); }
            });
            window.mitiru.onStateChange('view.launcher.flash', json => {
                if (json === lastFlashJson) return;
                lastFlashJson = json;
                try {
                    const f = JSON.parse(json);
                    showFlash(f.kind || 'info', f.message || '');
                } catch (e) { console.error('flash parse', e); }
            });

            let flashHideTimer = null;
            function showFlash(kind, message) {
                if (!message) return;
                flashEl.className = 'flash kind-' + kind + ' is-visible';
                flashEl.textContent = message;
                if (flashHideTimer) clearTimeout(flashHideTimer);
                flashHideTimer = setTimeout(() => {
                    flashEl.classList.remove('is-visible');
                }, 5500);
            }

            // ── Action dispatch (CEF → C++) ─────────────────
            addBtn.addEventListener('click', () => {
                window.mitiru.dispatch('launcher.add_project', {});
            });
            newBtn.addEventListener('click', async () => {
                if (!env.canScaffold) {
                    showFlash('error', 'Scaffolding disabled — engine source not found.');
                    return;
                }
                const name = await modalPrompt(
                    'New project',
                    'my_game',
                    'Letters, digits, underscore. Becomes the CMake target name and source dir under examples/.'
                );
                if (!name) return;
                if (!/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(name)) {
                    showFlash('error', 'Invalid name. Use letters, digits, underscore. Must start with letter or _.');
                    return;
                }
                window.mitiru.dispatch('launcher.scaffold', {name: name});
            });
            projectsList.addEventListener('click', (ev) => {
                const btn = ev.target.closest('button.action');
                if (!btn || btn.disabled) return;
                const act = btn.dataset.act;
                const idx = parseInt(btn.dataset.idx, 10);
                if (Number.isNaN(idx)) return;
                if (act === 'open')         { window.mitiru.dispatch('launcher.open',        {index: idx}); }
                else if (act === 'open_folder') { window.mitiru.dispatch('launcher.open_folder', {index: idx}); }
                else if (act === 'remove') {
                    modalConfirm(
                        'Remove from list?',
                        'The DLL file stays on disk — only the launcher entry is removed.'
                    ).then(ok => {
                        if (ok) {
                            window.mitiru.dispatch('launcher.remove_project', {index: idx});
                        }
                    });
                }
            });

            renderProjects([]);
            renderRecents([]);
        })();
    </script>
</body>
</html>
