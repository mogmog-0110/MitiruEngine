<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>frame</title>
<link rel="stylesheet" href="tool.css">
<style>
  .nav{ display:flex; align-items:center; gap:.5rem; }
  .nav button{
    font-family:var(--mono); font-size:.72rem; letter-spacing:.06em; padding:.4rem .8rem;
    background:var(--wash); border:1px solid var(--rule); color:var(--ink); cursor:pointer;
  }
  .nav button:hover:not(:disabled){ background:var(--rule-soft); }
  .nav button:disabled{ color:var(--faint); cursor:default; }
  .nav .frameno{ flex:1 1 auto; text-align:center; font-family:var(--mono); font-size:.8rem; }
  .err{ color:#a33; font-family:var(--mono); font-size:.76rem; margin-top:.5rem; display:none; }
  .hint{ margin-top:.4rem; font-family:var(--mono); font-size:.68rem; color:var(--faint); }

  .chip{
    display:inline-block; font-family:var(--mono); font-size:.72rem; padding:.15rem .5rem;
    background:var(--wash); border:1px solid var(--rule-soft); margin:.15rem .25rem .15rem 0;
  }
  .writes .row{ display:flex; gap:.5rem; padding:.3rem .5rem; border-bottom:1px solid var(--rule-soft); font-family:var(--mono); font-size:.74rem; }
  .writes .row:last-child{ border-bottom:0; }
  .writes .path{ flex:0 0 34%; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .writes .vals{ flex:0 0 30%; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .writes .blame{ flex:1 1 auto; color:var(--ink); }
  .writes .blame.unsupported{ color:var(--faint); }
  .empty{ color:var(--faint); font-family:var(--mono); font-size:.74rem; }

  .draw table{ width:100%; border-collapse:collapse; font-family:var(--mono); font-size:.72rem; }
  .draw th{ text-align:left; color:var(--faint); font-weight:500; padding:.2rem .4rem; border-bottom:1px solid var(--rule-soft); }
  .draw td{ padding:.2rem .4rem; border-bottom:1px solid var(--rule-soft); color:var(--ink-body); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:12rem; }
  .draw tr:last-child td{ border-bottom:0; }
</style>
</head>
<body id="body">
  <header><span class="dot"></span><h1>frame anatomy</h1></header>
  <div class="body">
    <div class="nav">
      <button id="prev">← 前のフレーム</button>
      <span class="frameno" id="frameno">-</span>
      <button id="next">次のフレーム →</button>
    </div>
    <div class="hint">F7 でステップ実行しながら見る (対象ゲームが --http-port で起動している必要がある)</div>
    <div class="err" id="err"></div>

    <div class="label">1. 入力</div>
    <div class="panel" id="input"><span class="empty">-</span></div>

    <div class="label">2-3. update の分岐 / 書かれたフィールド (blame)</div>
    <div class="panel writes" id="writes"><span class="empty">-</span></div>

    <div class="label">4. 描画コマンド</div>
    <div class="panel draw" id="draw"><span class="empty">-</span></div>

    <div class="label">5. 音</div>
    <div class="panel" id="sound"><span class="empty">-</span></div>
  </div>

<script>
// 1 フレームの解剖図 (P10、ADR 0035 応用)。why_view と同じく対象ゲームの HTTP API を
// 直接叩く対話窓 (SharedSnapshot 経由の push 型ではなく fetch())。framesAgo (offset) は
// 「現在から何フレーム前を見るか」で、F7 ステップ実行と組み合わせて offset=0 のまま
// ポーリングすれば「1 歩進むごとに解剖図が更新される」体験になる。
(function () {
  const err     = document.getElementById('err');
  const frameno = document.getElementById('frameno');
  const inputEl = document.getElementById('input');
  const writesEl = document.getElementById('writes');
  const drawEl   = document.getElementById('draw');
  const soundEl  = document.getElementById('sound');
  const prevBtn  = document.getElementById('prev');
  const nextBtn  = document.getElementById('next');

  let httpPort = 8090;   // 既定は EngineHttpServer::init の既定値と同じ (why_view と同じ規約)
  window.applyConfig = function (cfg) {
    if (cfg && typeof cfg.httpPort === 'number' && cfg.httpPort > 0) { httpPort = cfg.httpPort; }
  };

  let offset = 0;      // 0 = 直近フレーム (framesAgo)
  let ringSize = 0;    // 直近取得の ringSize (次/前の可動域)
  let polling = true;  // offset=0 の間だけ自動更新する (履歴を見ている間は動かさない)

  function fmt(v) {
    if (v === null || v === undefined) { return 'null'; }
    if (typeof v === 'number') { return Number.isInteger(v) ? String(v) : v.toFixed(3); }
    return JSON.stringify(v);
  }

  function renderInput(inp) {
    if (!inp) { inputEl.innerHTML = '<span class="empty">入力なし (ring 範囲外)</span>'; return; }
    const chips = [];
    if (inp.keysDown && inp.keysDown.length) { chips.push('keys: ' + inp.keysDown.join(',')); }
    if (inp.gamepadConnected) { chips.push('pad axes: ' + inp.gamepadAxes.map(a => a.toFixed(2)).join(',')); }
    if (inp.textInput) { chips.push('text: "' + inp.textInput + '"'); }
    chips.push('mouse: (' + inp.mouseX.toFixed(0) + ', ' + inp.mouseY.toFixed(0) + ')');
    chips.push('dt: ' + inp.effectiveDt.toFixed(4) + (inp.paused ? ' (paused)' : ''));
    inputEl.innerHTML = chips.map(c => '<span class="chip">' + c.replace(/</g, '&lt;') + '</span>').join('');
  }

  function renderWrites(writes) {
    if (!writes || writes.length === 0) { writesEl.innerHTML = '<span class="empty">このフレームで変化した field なし</span>'; return; }
    writesEl.innerHTML = writes.map(w => {
      const blameText = w.blameSupported ? w.blame : '未対応 (mitiru_why_blame_at 未 export)';
      const blameCls = w.blameSupported ? 'blame' : 'blame unsupported';
      return '<div class="row">'
        + '<div class="path">' + w.path + '</div>'
        + '<div class="vals">' + fmt(w.from) + ' → ' + fmt(w.to) + '</div>'
        + '<div class="' + blameCls + '">' + blameText + '</div>'
        + '</div>';
    }).join('');
  }

  function renderDraw(draws) {
    if (!draws || draws.length === 0) { drawEl.innerHTML = '<span class="empty">描画コマンドなし</span>'; return; }
    let html = '<table><tr><th>種類</th><th>x</th><th>y</th><th>w</th><th>h</th><th>text</th></tr>';
    for (const d of draws) {
      html += '<tr><td>' + d.call + '</td><td>' + d.x.toFixed(0) + '</td><td>' + d.y.toFixed(0)
        + '</td><td>' + d.w.toFixed(0) + '</td><td>' + d.h.toFixed(0) + '</td><td>' + (d.text || '') + '</td></tr>';
    }
    html += '</table>';
    drawEl.innerHTML = html;
  }

  function renderSound(sound) {
    if (!sound || !sound.events || sound.events.length === 0) { soundEl.innerHTML = '<span class="empty">音イベントなし</span>'; return; }
    soundEl.innerHTML = sound.events.map(e => '<span class="chip">' + JSON.stringify(e).replace(/</g, '&lt;') + '</span>').join('')
      + '<div class="hint">total: ' + sound.total + '</div>';
  }

  function updateNav() {
    frameno.textContent = 'frame ' + (window.__lastFrame ?? '-') + '  (' + offset + ' フレーム前 / ring ' + ringSize + ')';
    prevBtn.disabled = ringSize > 0 && offset >= ringSize - 2;
    nextBtn.disabled = offset <= 0;
  }

  async function query() {
    err.style.display = 'none';
    try {
      const res = await fetch('http://127.0.0.1:' + httpPort + '/api/frame/anatomy?frame=' + offset);
      const j = await res.json();
      if (!res.ok || j.error) {
        err.textContent = j.error || ('HTTP ' + res.status);
        err.style.display = 'block';
        return;
      }
      window.__lastFrame = j.frame;
      ringSize = j.ringSize || 0;
      updateNav();
      renderInput(j.input);
      renderWrites(j.writes);
      renderDraw(j.draw);
      renderSound(j.sound);
    } catch (e) {
      err.textContent = '接続失敗: ' + e.message + ' (127.0.0.1:' + httpPort + ' が listen していますか?)';
      err.style.display = 'block';
    }
  }

  prevBtn.addEventListener('click', function () {
    if (ringSize > 0 && offset >= ringSize - 2) { return; }
    offset += 1;
    polling = false;
    query();
  });
  nextBtn.addEventListener('click', function () {
    if (offset <= 0) { return; }
    offset -= 1;
    polling = (offset === 0);
    query();
  });

  query();
  setInterval(function () { if (polling) { query(); } }, 200);
})();
</script>
</body>
</html>
