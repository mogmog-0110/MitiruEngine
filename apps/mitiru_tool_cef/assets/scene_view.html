<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>scene view</title>
<link rel="stylesheet" href="tool.css">
<style>
/* この窓だけの追加スタイル。tool.css の紙地テーマを踏襲しつつ、canvas 面だけ濃色にする
   (ゲーム画面の PNG に枠を重ねるので、白紙の上だと縁が見えにくい)。 */
.stage{ position:relative; margin-top:.5rem; background:#111214; border:1px solid var(--rule-soft);
        overflow:hidden; }
.stage img{ display:block; width:100%; height:auto; }
.stage canvas{ position:absolute; left:0; top:0; width:100%; height:100%; cursor:default; }
.toolbar{ display:flex; align-items:center; gap:.5rem; margin-top:.5rem; }
.toolbar button{
  font-family:var(--mono); font-size:.72rem; letter-spacing:.06em; padding:.4rem .8rem;
  background:var(--wash); border:1px solid var(--rule); color:var(--ink); cursor:pointer;
}
.toolbar button:disabled{ color:var(--faint); cursor:default; }
.toolbar button.commit:not(:disabled){ border-color:#2a6b3f; color:#2a6b3f; }
.toolbar button.discard:not(:disabled){ border-color:#8a2a2a; color:#8a2a2a; }
.toolbar .status{ font-family:var(--mono); font-size:.7rem; color:var(--muted); margin-left:auto; }
.mini-inspector{ margin-top:.6rem; }
.mini-inspector .row{ display:flex; align-items:center; padding:.3rem .5rem; border-bottom:1px solid var(--rule-soft); }
.mini-inspector .k{ flex:0 0 40%; font-family:var(--mono); font-size:.72rem; color:var(--muted); }
.mini-inspector .v{ flex:1 1 auto; font-family:var(--mono); font-size:.72rem; color:var(--ink); }
.mini-inspector .cand-btn{
  font-family:var(--mono); font-size:.65rem; padding:.15rem .5rem; margin-left:.4rem;
  background:var(--wash); border:1px solid var(--rule); color:var(--muted); cursor:pointer;
}
.candidates{ margin-top:.4rem; display:flex; flex-wrap:wrap; gap:.4rem; }
.candidates .chip{
  font-family:var(--mono); font-size:.68rem; padding:.3rem .6rem; cursor:pointer;
  background:var(--wash); border:1px solid var(--rule); color:var(--ink);
}
/* slot 0..3 = 赤/緑/青/黄。Engine::drawCandidateBranches の kTint と同じ並び (ADR 0035 O4) */
.candidates .chip.slot0{ border-color:#c24d4d; }
.candidates .chip.slot1{ border-color:#4dae5a; }
.candidates .chip.slot2{ border-color:#4d7fc2; }
.candidates .chip.slot3{ border-color:#b8a53a; }
.replay-gate{ margin-top:.6rem; font-family:var(--mono); font-size:.7rem; }
.replay-gate .row{ display:flex; gap:.4rem; padding:.15rem .2rem; align-items:center; }
.replay-gate .dot{ width:.6rem; height:.6rem; border-radius:50%; flex:0 0 auto; }
.replay-gate .dot.pass{ background:#2a6b3f; }
.replay-gate .dot.fail{ background:#8a2a2a; }
.replay-gate .reason{ color:var(--muted); }
.port-row{ display:flex; gap:.4rem; align-items:center; margin-top:.3rem; }
.port-row input{ font-family:var(--mono); font-size:.7rem; width:4.5rem; padding:.2rem .3rem;
  border:1px solid var(--rule); background:var(--well); color:var(--ink); }
.port-row label{ font-family:var(--mono); font-size:.68rem; color:var(--faint); }
/* 4-3: 分岐中 (commit/discard していない試行値) の印。Unity Entities の Play モード編集の
   橙バーに倣う。banner はページ上部で件数を出し、行ごとの印は mini inspector 側に付ける。 */
.branch-banner{
  display:none; align-items:center; gap:.5rem; margin-top:.4rem; padding:.35rem .6rem;
  background:#3a2a12; border:1px solid #b8792e; color:#e8b23d;
  font-family:var(--mono); font-size:.72rem;
}
.mini-inspector .row.branch-dirty{ border-left:3px solid #d98a1f; padding-left:.4rem; }
</style>
</head>
<body class="is-waiting" data-m-class="is-waiting: !tool.snap.sceneView">
  <header><span class="dot"></span><h1>scene view</h1></header>
  <div class="body">
    <div class="port-row">
      <label for="port">/api port</label>
      <input id="port" type="number" value="8090">
      <span class="status" id="hint">ドラッグ or 候補ボタン → 分岐 → 残す/捨てる (Shift+ドラッグで矩形選択、Ctrl+クリックで追加、Esc で解除)</span>
    </div>
    <!-- mitiru_tool_cef が --http-port から window.applyConfig({httpPort}) を push する
         (O6 why_view と共通の仕組み)。届けば上の手動入力は上書きする。 -->

    <!-- 4-3: /api/ai/state の branch.active を見て、まだ commit/discard していない
         フィールドがあることをページ上部で常に見えるようにする。 -->
    <div class="branch-banner" id="branchBanner"></div>

    <div class="stage" id="stage">
      <img id="shot" alt="">
      <canvas id="overlay"></canvas>
    </div>

    <div class="toolbar">
      <button id="commitBtn" class="commit" disabled>残す</button>
      <button id="discardBtn" class="discard" disabled>捨てる</button>
      <button id="undoBtn" disabled title="Ctrl+Z">戻す</button>
      <button id="redoBtn" disabled title="Ctrl+Y">やり直す</button>
      <span class="status" id="branchStatus"></span>
    </div>

    <div class="mini-inspector" id="miniInspector"></div>
    <!-- ADR 0035 O4/P4: 選択中フィールドの ±10%/±25% を 4 案並走 (POST /api/ai/candidates)。
         ゴースト自体は host が live 画面へ直接合成する (Engine::drawCandidateBranches、
         ModuleAdapter::draw から毎フレーム呼ぶ) ので、この窓は変換元の PNG を貼るだけで
         色付きゴーストが自動的に映る。ここは案の一覧 (数値・色) と「選ぶ」ボタンだけ持つ。 -->
    <div class="candidates" id="candidates"></div>
    <!-- ADR 0035 O5: 「残す」直後に host が裏で tests/replay_golden/*.mtrr を再実行した結果
         (tool.snap.replayGate)。緑=一致 (退行なし) / 赤=壊れた録画。 -->
    <div class="replay-gate" id="replayGate"></div>
  </div>
  <div class="wait">waiting for the game…</div>

<script>
'use strict';
// このページは他ツールと違い data-m-kv の宣言的バインディングを使わず、canvas 描画 +
// HTTP fetch (PUT /api/ai/state, POST /api/ai/commit|discard) を自前で行う (ADR 0035 O2/O3)。
// window.applySnapshot は ToolCef 側が毎 tick 呼ぶ契約 (他ページと共通)。ここでは
// tool.snap.sceneView (このファイルの Engine_Module_Adapter.hpp が書く枠一覧) と
// tool.snap.gameMemory.state (現在値、/api/ai/state と同じ dotted key) だけを見る。

var state = {
	ready: false,
	objects: [],       // [{id,x,y,w,h,field}]
	gameMemory: {},     // dotted key -> 現在値
	selection: [],      // 選択中 object の配列 (objects の要素そのもの。末尾が主選択 = mini inspector の対象)
	marquee: null,      // Shift ドラッグ中の矩形 {x0,y0,x1,y1} (canvas 座標)
	dragging: null,     // {entries: [{obj, origX, origY}], startX, startY}
	pendingEdit: null,  // 直近の PUT で送った {field: value, ...} (残す/捨てるの対象)
	shotSeq: 0,
	candidateField: null,   // P4: 候補を出した field 名
	candidateValues: null,  // P4: その 4 案の値 ([slot0..3])
	candidateBaseFrame: null, // 3-5: 候補がどの frame から分岐したか (/api/ai/candidates の baseFrame)
	branch: { active: false, fields: [] },  // 4-3: /api/ai/state.branch (commit/discard 前の一覧)
	// 分岐の中での取り消し (配置データを変える操作だけを積む。
	// 選択や表示切替は積まない)。commit/discard で空にする。
	undo: { done: [], undone: [], max: 128 },  // {label, before: {k: v}, after: {k: v}}
};

function apiBase() {
	var p = document.getElementById('port').value || '8090';
	return 'http://127.0.0.1:' + p;
}

function setStatus(text) { document.getElementById('branchStatus').textContent = text || ''; }

// 1 回の PUT は host の reflectFields[128] に収まる必要があり、1 体につき x/y の 2 field を書く。
var kMaxSelection = 60;

function primarySelected() { return state.selection.length ? state.selection[state.selection.length - 1] : null; }

function isSelectedId(id) {
	for (var i = 0; i < state.selection.length; i++) { if (state.selection[i].id === id) { return true; } }
	return false;
}

// Ctrl クリック: 含まれていれば外し、無ければ末尾 (主選択) に足す。新しい配列を返す。
function toggleSelection(list, obj) {
	var without = list.filter(function (o) { return o.id !== obj.id; });
	if (without.length !== list.length) { return without; }
	return without.concat([obj]);
}

// 矩形選択は枠の中心点が矩形に入るかで決める (DevTools の frustum.Test(position) と同じ中心点判定。
// 交差判定にすると画面いっぱいの背景枠まで拾ってしまう)。
function objectsInRect(objects, rect) {
	var x0 = Math.min(rect.x0, rect.x1), x1 = Math.max(rect.x0, rect.x1);
	var y0 = Math.min(rect.y0, rect.y1), y1 = Math.max(rect.y0, rect.y1);
	return objects.filter(function (o) {
		var cx = o.x + o.w / 2, cy = o.y + o.h / 2;
		return cx >= x0 && cx <= x1 && cy >= y0 && cy <= y1;
	});
}

// 選択全員に同じ差分を足した PUT の本文 (1 command)。枠の座標は画面 (world) だが、書き戻す field は
// LocalTransform の子なら親相対 (local) なので、絶対値ではなく現在値に差分を足す。現在値が無い
// (名前解決できていない) ときだけ枠の絶対座標を書き、field 名も無い枠は飛ばす。
function moveFieldsFor(entries, gm, dx, dy) {
	var fields = {};
	entries.forEach(function (e) {
		var o = e.obj;
		if (!o.field && !o.fieldX) { return; }
		var kx, ky;
		if (o.fieldX && o.fieldY) { kx = o.fieldX; ky = o.fieldY; }
		else { kx = o.field + '.x'; ky = o.field + '.y'; }
		fields[kx] = (typeof gm[kx] === 'number') ? gm[kx] + dx : o.x;
		fields[ky] = (typeof gm[ky] === 'number') ? gm[ky] + dy : o.y;
	});
	return fields;
}

// PUT の前後の値を 1 command として積む。before は現在値から拾えたキーだけ (拾えなければ戻せない)。
function pushUndo(label, after) {
	var gm = state.gameMemory || {};
	var before = {};
	var ok = false;
	Object.keys(after).forEach(function (k) { if (typeof gm[k] === 'number') { before[k] = gm[k]; ok = true; } });
	if (!ok) { return; }
	state.undo.done.push({ label: label, before: before, after: after });
	if (state.undo.done.length > state.undo.max) { state.undo.done.shift(); }
	state.undo.undone = [];
	renderUndoButtons();
}

function renderUndoButtons() {
	document.getElementById('undoBtn').disabled = state.undo.done.length === 0;
	document.getElementById('redoBtn').disabled = state.undo.undone.length === 0;
}

// 戻す/やり直すも PUT なので、残す/捨てるの対象 (pendingEdit) はその値になる。
function applyUndoStep(fields, label) {
	setStatus(label + '…');
	return putState(fields).then(function (res) {
		if (!res.ok) { setStatus(label + 'に失敗: ' + (res.body && res.body.error || '')); return false; }
		state.pendingEdit = fields;
		state.gameMemory = res.body;
		document.getElementById('commitBtn').disabled = false;
		document.getElementById('discardBtn').disabled = false;
		setStatus(label + 'ました。残す/捨てるを選んでください');
		renderMiniInspector();
		drawOverlay();
		return true;
	});
}

function undoLast() {
	if (state.undo.done.length === 0) { return; }
	var cmd = state.undo.done.pop();
	state.undo.undone.push(cmd);
	renderUndoButtons();
	applyUndoStep(cmd.before, '戻し (' + cmd.label + ')');
}

function redoLast() {
	if (state.undo.undone.length === 0) { return; }
	var cmd = state.undo.undone.pop();
	state.undo.done.push(cmd);
	renderUndoButtons();
	applyUndoStep(cmd.after, 'やり直し (' + cmd.label + ')');
}

function fetchScreenshot() {
	// /api/ai/frame は draw log も含む重い応答だが、screenshot=1 だけあれば十分。
	// draw log 自体は使わない (毎回 drawLogEnable(true) を叩くだけの副作用は許容する)。
	fetch(apiBase() + '/api/ai/frame?screenshot=1&width=800', { cache: 'no-store' })
		.then(function (r) { return r.ok ? r.json() : null; })
		.then(function (j) {
			if (!j || !j.screenshot) { return; }
			document.getElementById('shot').src = 'data:image/png;base64,' + j.screenshot.pngBase64;
		})
		.catch(function () { /* game 側 HTTP API 未起動 (--http-port 未指定等)。次回 poll で再試行 */ });
}

// 4-3: /api/ai/state を poll し、branch.active/fields をページ上部の帯と
// mini inspector の行の橙バーへ反映する (画面上の「これは正史ではない」の唯一の印)。
function fetchBranchState() {
	fetch(apiBase() + '/api/ai/state', { cache: 'no-store' })
		.then(function (r) { return r.ok ? r.json() : null; })
		.then(function (j) {
			state.branch = (j && j.branch && typeof j.branch === 'object')
				? j.branch : { active: false, fields: [] };
			renderBranchBanner();
			renderMiniInspector();
		})
		.catch(function () { /* game 側 HTTP API 未起動。次回 poll で再試行 */ });
}

function renderBranchBanner() {
	var el = document.getElementById('branchBanner');
	var fields = (state.branch && state.branch.fields) || [];
	if (!state.branch || !state.branch.active || fields.length === 0) {
		el.style.display = 'none';
		return;
	}
	el.style.display = 'flex';
	el.textContent = '分岐中: ' + fields.length + ' フィールド（残す / 捨てる）';
}

// key (dotted path) が branch.fields のいずれかと一致するか、その配下かを見る。
function isBranchDirty(key) {
	var fields = (state.branch && state.branch.fields) || [];
	for (var i = 0; i < fields.length; i++) {
		var f = fields[i];
		if (key === f || key.indexOf(f + '.') === 0) { return true; }
	}
	return false;
}

function resizeCanvasToImage() {
	var img = document.getElementById('shot');
	var cv = document.getElementById('overlay');
	if (img.naturalWidth > 0) { cv.width = img.naturalWidth; cv.height = img.naturalHeight; }
}

function drawOverlay() {
	var cv = document.getElementById('overlay');
	var ctx = cv.getContext('2d');
	ctx.clearRect(0, 0, cv.width, cv.height);
	state.objects.forEach(function (o) {
		var selected = isSelectedId(o.id);
		ctx.lineWidth = selected ? 2 : 1;
		ctx.strokeStyle = selected ? '#e8b23d' : '#4da3ff';
		ctx.strokeRect(o.x, o.y, o.w, o.h);
		var label = o.field || (o.fieldX && o.fieldY ? o.fieldX + '/' + o.fieldY : null);
		if (label) {
			ctx.font = '10px monospace';
			ctx.fillStyle = selected ? '#e8b23d' : '#4da3ff';
			ctx.fillText(label, o.x, Math.max(10, o.y - 2));
		}
	});
	if (state.marquee) {
		var m = state.marquee;
		ctx.setLineDash([4, 3]); ctx.lineWidth = 1; ctx.strokeStyle = '#e8b23d';
		ctx.strokeRect(Math.min(m.x0, m.x1), Math.min(m.y0, m.y1), Math.abs(m.x1 - m.x0), Math.abs(m.y1 - m.y0));
		ctx.setLineDash([]);
	}
}

function objectAt(px, py) {
	// 後ろ (配列末尾、最後に描かれた = 手前) から探す。
	for (var i = state.objects.length - 1; i >= 0; --i) {
		var o = state.objects[i];
		if (px >= o.x && px <= o.x + o.w && py >= o.y && py <= o.y + o.h) { return o; }
	}
	return null;
}

function canvasPoint(evt) {
	var cv = document.getElementById('overlay');
	var rect = cv.getBoundingClientRect();
	// canvas の内部解像度 (naturalWidth) と CSS 表示サイズが違うのでスケールを合わせる。
	var sx = cv.width / rect.width, sy = cv.height / rect.height;
	return { x: (evt.clientX - rect.left) * sx, y: (evt.clientY - rect.top) * sy };
}

function renderMiniInspector() {
	var el = document.getElementById('miniInspector');
	el.innerHTML = '';
	var sel = primarySelected();
	if (state.selection.length > 1) {
		var head = document.createElement('div');
		head.className = 'row';
		head.textContent = state.selection.length + ' 個を選択中 (ドラッグで一括移動、Esc で解除)';
		el.appendChild(head);
	}
	if (!sel || (!sel.field && !sel.fieldX)) { return; }
	var gm = state.gameMemory || {};
	var keys;
	if (sel.field) {
		var prefix = sel.field;
		keys = Object.keys(gm).filter(function (k) { return k === prefix || k.indexOf(prefix + '.') === 0; });
	} else {
		// fieldX/fieldY 明示指定 (beginObject(name, fieldX, fieldY)): その 2 キーだけを表示する。
		keys = [sel.fieldX, sel.fieldY].filter(function (k) { return k in gm; });
	}
	keys.sort().forEach(function (k) {
			var row = document.createElement('div');
			row.className = 'row' + (isBranchDirty(k) ? ' branch-dirty' : '');
			var kEl = document.createElement('div'); kEl.className = 'k'; kEl.textContent = k;
			var vEl = document.createElement('div'); vEl.className = 'v'; vEl.textContent = JSON.stringify(gm[k]);
			row.appendChild(kEl); row.appendChild(vEl);
			// P4: 数値フィールドだけ「候補」ボタン (スライダの代わりに 4 案並走 → 選ぶ)。
			if (typeof gm[k] === 'number') {
				var btn = document.createElement('button');
				btn.className = 'cand-btn';
				btn.textContent = '候補';
				btn.addEventListener('click', function () { generateCandidates(k, gm[k]); });
				row.appendChild(btn);
			}
			el.appendChild(row);
		});
}

// ADR 0035 O4/P4: 選択した数値フィールド 1 個を ±10%/±25% した 4 案を並走させる
// (POST /api/ai/candidates)。ゼロ付近だと比率だけでは動かないので絶対量のフォールバックを足す。
function candidateDeltas(base) {
	var unit = Math.abs(base) > 1e-6 ? Math.abs(base) : 1.0;
	return [-0.25, -0.10, 0.10, 0.25].map(function (r) { return base + unit * r; });
}

function generateCandidates(field, base) {
	var values = candidateDeltas(base);
	var body = {
		variants: values.map(function (v) { var o = {}; o[field] = v; return { overrides: o }; }),
		keys: '', frames: 60
	};
	setStatus('候補を計算中…');
	fetch(apiBase() + '/api/ai/candidates', {
		method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
	}).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
	  .then(function (res) {
		if (!res.ok) { setStatus('候補の生成に失敗: ' + (res.body && res.body.error || '')); return; }
		state.candidateField = field;
		state.candidateValues = values;
		// 3-5: 全 slot は同じ frame から分岐する (GameMemory は 1 個しかないので base は共通)。
		var results = res.body && res.body.results;
		state.candidateBaseFrame = (results && results.length > 0) ? results[0].baseFrame : null;
		renderCandidates();
		setStatus('候補 4 案をゴースト表示中 (色は slot 0〜3)。クリックで選ぶ');
	});
}

function renderCandidates() {
	var el = document.getElementById('candidates');
	el.innerHTML = '';
	if (!state.candidateField || !state.candidateValues) { return; }
	state.candidateValues.forEach(function (v, slot) {
		var chip = document.createElement('button');
		chip.className = 'chip slot' + slot;
		var label = state.candidateField + ' = ' + (Math.round(v * 1000) / 1000);
		if (state.candidateBaseFrame !== null && state.candidateBaseFrame !== undefined)
		{ label += ' (frame ' + state.candidateBaseFrame + ' から)'; }
		chip.textContent = label;
		chip.addEventListener('click', function () { selectCandidate(v); });
		el.appendChild(chip);
	});
}

// 案を選ぶ = その値で PUT /api/ai/state (通常のドラッグ分岐と同じ経路) → 残す/捨てるを選べる状態にする。
function selectCandidate(value) {
	var fields = {};
	fields[state.candidateField] = value;
	setStatus('選んだ案を試行中…');
	pushUndo('候補を採用 ' + state.candidateField, fields);
	putState(fields).then(function (res) {
		if (!res.ok) { setStatus('分岐に失敗: ' + (res.body && res.body.error || '')); return; }
		state.pendingEdit = fields;
		state.gameMemory = res.body;
		document.getElementById('commitBtn').disabled = false;
		document.getElementById('discardBtn').disabled = false;
		setStatus('案を試行済み。残す/捨てるを選んでください');
		renderMiniInspector();
	});
}

function putState(fields) {
	// PUT /api/ai/state: 分岐 (branchModuleMemory と同じ複製→書き換え→復元経路)。応答の
	// reflected JSON をそのまま mini inspector に反映する (live GameMemory 自体は変わらない、
	// ADR 0035「試す」)。UI 上はこの応答値を「今ドラッグしたらこうなる」の見た目として使う。
	return fetch(apiBase() + '/api/ai/state', {
		method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(fields)
	}).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
	  .catch(function () {
		// game 側 HTTP API に届かない (--http-port 未指定等)。「試行中…」のまま止まらないよう失敗として返す。
		return { ok: false, body: { error: 'game の /api に接続できません (port ' + (document.getElementById('port').value || '8090') + ')' } };
	  });
}

// クリック = 単独選択、Ctrl+クリック = 追加/解除、Shift+空白ドラッグ = 矩形選択、選択済みの枠を
// つかむと選択全員をまとめて動かす (DevTools の Selection / SelectionTransformation と同じ手触り)。
function onPointerDown(evt) {
	var pt = canvasPoint(evt);
	var hit = objectAt(pt.x, pt.y);
	state.candidateField = null;  // 別 object を選び直したら前の候補一覧は消す (ゴースト自体は
	state.candidateValues = null; // host 側が次の /api/ai/candidates まで表示し続ける、既知の制約)
	renderCandidates();
	var additive = evt.ctrlKey || evt.metaKey;
	if (evt.shiftKey && !hit) {
		state.marquee = { x0: pt.x, y0: pt.y, x1: pt.x, y1: pt.y };
		drawOverlay();
		return;
	}
	if (!hit) { state.selection = []; }
	else if (additive) { state.selection = toggleSelection(state.selection, hit); }
	else if (!isSelectedId(hit.id)) { state.selection = [hit]; }
	renderMiniInspector();
	drawOverlay();
	if (!hit || additive) { return; }
	state.dragging = {
		entries: state.selection.map(function (o) { return { obj: o, origX: o.x, origY: o.y }; }),
		startX: pt.x, startY: pt.y
	};
}

function onPointerMove(evt) {
	if (state.marquee) {
		var mp = canvasPoint(evt);
		state.marquee.x1 = mp.x; state.marquee.y1 = mp.y;
		drawOverlay();
		return;
	}
	if (!state.dragging) { return; }
	var pt = canvasPoint(evt);
	var d = state.dragging;
	d.entries.forEach(function (e) {
		e.obj.x = e.origX + (pt.x - d.startX);
		e.obj.y = e.origY + (pt.y - d.startY);
	});
	drawOverlay();
}

function finishMarquee() {
	var picked = objectsInRect(state.objects, state.marquee);
	state.marquee = null;
	if (picked.length > kMaxSelection) {
		setStatus('選択は ' + kMaxSelection + ' 個まで (1 回の PUT に載る field 数の上限)。先頭 ' + kMaxSelection + ' 個だけ選びました');
		picked = picked.slice(0, kMaxSelection);
	}
	state.selection = picked;
	renderMiniInspector();
	drawOverlay();
}

function onPointerUp() {
	if (state.marquee) { finishMarquee(); return; }
	if (!state.dragging) { return; }
	var d = state.dragging;
	state.dragging = null;
	var first = d.entries[0];
	if (!first) { return; }
	var dx = first.obj.x - first.origX, dy = first.obj.y - first.origY;
	var fields = moveFieldsFor(d.entries, state.gameMemory || {}, dx, dy);
	if (Object.keys(fields).length === 0) { return; }  // 名前解決できなかった枠だけならドラッグ不可
	var label = d.entries.length > 1 ? '移動 ' + d.entries.length + ' 個' : '移動 ' + (first.obj.field || first.obj.fieldX);
	if (dx !== 0 || dy !== 0) { pushUndo(label, fields); }
	setStatus('分岐を試行中…');
	putState(fields).then(function (res) {
		if (!res.ok) { setStatus('分岐に失敗: ' + (res.body && res.body.error || '')); return; }
		state.pendingEdit = fields;
		state.gameMemory = res.body;
		document.getElementById('commitBtn').disabled = false;
		document.getElementById('discardBtn').disabled = false;
		setStatus('分岐を試行済み。残す/捨てるを選んでください');
		renderMiniInspector();
	});
}

function commitPending() {
	if (!state.pendingEdit) { return; }
	setStatus('確定中…');
	fetch(apiBase() + '/api/ai/commit', {
		method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state.pendingEdit)
	}).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
	  .then(function (res) {
		setStatus(res.ok ? '残しました (live GameMemory に確定)' : '確定に失敗: ' + (res.body && res.body.error || ''));
		clearPending();
		fetchBranchState();
	  });
}

function discardPending() {
	if (!state.pendingEdit) { return; }
	fetch(apiBase() + '/api/ai/discard', { method: 'POST' })
		.then(function () { setStatus('捨てました (live は元のまま)'); clearPending(); fetchBranchState(); });
}

function clearPending() {
	state.pendingEdit = null;
	state.undo.done = [];
	state.undo.undone = [];
	renderUndoButtons();
	state.candidateField = null;
	state.candidateValues = null;
	renderCandidates();
	document.getElementById('commitBtn').disabled = true;
	document.getElementById('discardBtn').disabled = true;
}

document.getElementById('commitBtn').addEventListener('click', commitPending);
document.getElementById('discardBtn').addEventListener('click', discardPending);
document.getElementById('undoBtn').addEventListener('click', undoLast);
document.getElementById('redoBtn').addEventListener('click', redoLast);
window.addEventListener('keydown', function (evt) {
	if (evt.target && (evt.target.tagName === 'INPUT' || evt.target.tagName === 'TEXTAREA')) { return; }
	if (evt.key === 'Escape') {
		state.selection = []; state.marquee = null;
		renderMiniInspector(); drawOverlay();
		return;
	}
	if (!(evt.ctrlKey || evt.metaKey)) { return; }
	var key = evt.key.toLowerCase();
	if (key === 'z' && !evt.shiftKey) { evt.preventDefault(); undoLast(); }
	else if (key === 'y' || (key === 'z' && evt.shiftKey)) { evt.preventDefault(); redoLast(); }
});
document.getElementById('overlay').addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
document.getElementById('shot').addEventListener('load', function () { resizeCanvasToImage(); drawOverlay(); });

// ~600ms 毎に画面 PNG を取り直す (host 側の 6-frame cadence とだいたい合わせる程度で十分)。
setInterval(fetchScreenshot, 600);
fetchScreenshot();

// 分岐中の印は同じ cadence で十分 (commit/discard も人間の操作なので ms 単位の即時性は不要)。
setInterval(fetchBranchState, 600);
fetchBranchState();

// mitiru_tool_cef --http-port が届けば、手動入力欄より優先する (O6 why_view と共通の仕組み)。
window.applyConfig = function (cfg) {
	if (cfg && cfg.httpPort) { document.getElementById('port').value = cfg.httpPort; }
};

// ToolCef が毎 tick 呼ぶ契約 (他の tool ページと共通)。
window.applySnapshot = function (env) {
	document.body.classList.toggle('is-waiting', !env || !env.ready);
	if (!env || !env.snap) { return; }
	var snap = env.snap;
	if (snap.gameMemory && snap.gameMemory.state) { state.gameMemory = snap.gameMemory.state; }
	if (snap.sceneView && snap.sceneView.state && Array.isArray(snap.sceneView.state.objects)) {
		// ドラッグ中は host の新しい枠で置き換えない (置き換えると動かしている途中の枠が元の位置へ
		// 戻って見える)。それ以外は選択を id で新しい要素に付け替え、消えた枠は選択から外す。
		if (!state.dragging) {
			var incoming = snap.sceneView.state.objects;
			state.selection = state.selection.map(function (s) {
				return incoming.find(function (o) { return o.id === s.id; }) || null;
			}).filter(function (o) { return o !== null; });
			state.objects = incoming;
		}
	}
	if (snap.replayGate && snap.replayGate.state) { renderReplayGate(snap.replayGate.state.runs || []); }
	renderMiniInspector();
	drawOverlay();
};

// ADR 0035 O5: 決定論ゲート一覧 (緑=PASS/赤=FAIL)。host が commit のたびに書き換える。
function renderReplayGate(runs) {
	var el = document.getElementById('replayGate');
	el.innerHTML = '';
	if (!runs.length) { return; }
	var title = document.createElement('div');
	title.textContent = '決定論ゲート (' + runs.filter(function (r) { return r.pass; }).length + '/' + runs.length + ')';
	el.appendChild(title);
	runs.forEach(function (r) {
		var row = document.createElement('div');
		row.className = 'row';
		var dot = document.createElement('span'); dot.className = 'dot ' + (r.pass ? 'pass' : 'fail');
		var name = document.createElement('span'); name.textContent = r.file;
		row.appendChild(dot); row.appendChild(name);
		if (!r.pass && r.reason) {
			var reason = document.createElement('span'); reason.className = 'reason'; reason.textContent = '(' + r.reason + ')';
			row.appendChild(reason);
		}
		el.appendChild(row);
	});
}
</script>
</body>
</html>
