<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>perf</title>
<link rel="stylesheet" href="tool.css">
<style>
  .fps{ margin-top:22px; font-size:54px; font-weight:600; letter-spacing:-1px; line-height:1;
        font-variant-numeric:tabular-nums; }
  .fps small{ font-size:20px; font-weight:500; color:var(--muted); margin-left:8px; }
  .ms{ margin-top:8px; font-size:16px; color:var(--muted); font-variant-numeric:tabular-nums; }
  canvas{ display:block; width:100%; height:150px; }
</style>
</head>
<body class="is-waiting" data-m-class="is-waiting: !tool.snap.perf.state">
  <header><span class="dot"></span><h1>perf</h1></header>
  <div class="body">
    <div class="fps"><span data-m-text="tool.snap.perf.state.fps">--</span><small>fps</small></div>
    <div class="ms"><span data-m-text="tool.snap.perf.state.frameMs" data-m-format="f2">--</span> ms / frame</div>
    <div class="label">fps history · newest right</div>
    <div class="panel"><canvas width="320" height="150"
      data-m-spark-push="tool.snap.perf.state.fps"
      data-m-spark-cap="180" data-m-spark-baseline="60" data-m-spark-min="75"></canvas></div>
  </div>
  <div class="wait">waiting for the game…</div>

<script src="mitiru_runtime/mitiru_cef_state.js"></script>
<script src="mitiru_runtime/mitiru_bind.js"></script>
<script src="mitiru_runtime/mitiru_bind_tools.js"></script>
</body>
</html>
