<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>rewind</title>
<style>
  /* ゲーム窓の下に付く YouTube 風シークバー: ▶/⏸ ボタン + 明るいトラック + 赤い塗り + 丸いつまみ。 */
  html, body{ margin:0; height:100%; overflow:hidden; background:#eef0f3;
              font-family:system-ui, -apple-system, sans-serif; }
  .wrap{ position:absolute; inset:0; display:flex; align-items:center; gap:14px; padding:0 18px; }

  /* 再生 / 一時停止ボタン (赤い丸) */
  .pp{ width:32px; height:32px; flex:0 0 auto; border:none; border-radius:50%;
       background:#e0224b; cursor:pointer; position:relative; padding:0; }
  .playing .pp::before, .playing .pp::after{ content:''; position:absolute; top:50%; width:4px; height:13px;
       background:#fff; transform:translateY(-50%); border-radius:1px; }   /* ⏸ 二本線 */
  .playing .pp::before{ left:11px; }  .playing .pp::after{ left:17px; }
  .paused .pp::before{ content:''; position:absolute; top:50%; left:12px; transform:translateY(-50%);
       border-style:solid; border-width:7px 0 7px 12px;
       border-color:transparent transparent transparent #fff; }             /* ▶ 三角 */

  .bar{ position:relative; flex:1; height:100%; cursor:pointer; touch-action:none; }
  .track{ position:absolute; left:0; right:0; top:50%; height:6px; transform:translateY(-50%);
          background:#c4c8cf; border-radius:4px; transition:height .12s; }
  .fill{ position:absolute; left:0; top:50%; height:6px; transform:translateY(-50%);
         background:#e0224b; border-radius:4px; transition:height .12s; pointer-events:none; }
  .knob{ position:absolute; top:50%; width:16px; height:16px; margin-left:-8px; transform:translateY(-50%);
         background:#e0224b; border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.28); pointer-events:none;
         transition:width .12s, height .12s, margin-left .12s; }
  /* 節目 (値が変わった / 閾値を跨いだフレーム)。enum の系列は名前 (RUN→JUMP) が title に出る */
  .marks{ position:absolute; left:0; right:0; top:0; bottom:0; pointer-events:none; }
  .mark{ position:absolute; top:50%; width:2px; height:14px; margin-left:-1px; transform:translateY(-50%);
         background:#5c6470; opacity:.75; pointer-events:auto; }
  .mark.k1, .mark.k2{ background:#e0a022; }        /* 閾値跨ぎ */
  .mark.labeled{ background:#2a7de1; height:18px; }  /* 状態遷移 (名前付き) */
  .bar:hover .track, .bar:hover .fill{ height:9px; }
  .bar:hover .knob{ width:20px; height:20px; margin-left:-10px; }

  .wait{ position:absolute; inset:0; background:#eef0f3; }
  body:not(.is-waiting) .wait{ display:none; }

  /* P11: 予算の可視化。シークバーの邪魔にならない控えめな1行を右上に添える。 */
  .budget{ position:absolute; top:4px; right:10px; font-size:11px; color:#8a8f99;
            font-variant-numeric:tabular-nums; pointer-events:none; }
</style>
</head>
<body class="is-waiting playing" data-m-rewind="tool.snap.rewind.state" data-m-class="is-waiting: !tt.ok">
  <div class="wrap">
    <button class="pp" data-m-tt-playpause aria-label="再生 / 一時停止"></button>
    <div class="bar" data-m-tt-scrub>
      <div class="track"></div>
      <div class="fill" data-m-style="width: {tt.pct}%"></div>
      <div class="knob" data-m-style="left: {tt.pct}%"></div>
      <div class="marks" data-m-tt-marks></div>
    </div>
  </div>
  <div class="budget" data-m-budget-line></div>
  <div class="wait"></div>

<script src="mitiru_runtime/mitiru_cef_state.js"></script>
<script src="mitiru_runtime/mitiru_bind.js"></script>
<script src="mitiru_runtime/mitiru_bind_tools.js"></script>
<script>
// P11: 「あと何体いける」を作者の言葉で。既存の perf (frameMs) / sceneView (objects) を
// 組み合わせるだけの表示なので、engine 側の新規計測は要らない (docs/VISION_2026_09.md 参照)。
// 予算 16.6ms (60fps) に対する残り時間を、今の 1 体あたりコストで割って見積もる。
(function () {
	if (!window.mitiru || typeof window.mitiru.onStateChange !== 'function') { return; }
	var kBudgetMs = 16.6;
	window.mitiru.onStateChange('tool.snap', function (snap) {
		var el = document.querySelector('[data-m-budget-line]');
		if (!el) { return; }
		var perf = snap && snap.perf && snap.perf.state;
		var sv = snap && snap.sceneView && snap.sceneView.state;
		var frameMs = perf && typeof perf.frameMs === 'number' ? perf.frameMs : null;
		var count = sv && Array.isArray(sv.objects) ? sv.objects.length : 0;
		if (frameMs == null || count <= 0) { el.textContent = ''; return; }
		var perEntityMs = frameMs / count;
		var extra = perEntityMs > 0 ? Math.max(0, Math.floor((kBudgetMs - frameMs) / perEntityMs)) : 0;
		el.textContent = '今 ' + count + ' 体で ' + (Math.round(frameMs * 10) / 10) +
			' ms。予算 ' + kBudgetMs + 'ms なら あと約 ' + extra + ' 体';
	});
})();
</script>
</body>
</html>
