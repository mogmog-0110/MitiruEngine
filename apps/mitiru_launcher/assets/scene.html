<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>MitiruEngine Launcher — Saturn</title>
    <link rel="stylesheet" href="mitiru_runtime/mitiru_tokens.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <style>
        /* Launcher — Mitiru Saturn (canonical).
           Tokens imported above; this file applies them.
           Spec: docs/DESIGN.md (top-level). */

        /* Inline token fallback for CEF file:// resolution edge cases. */
        :root {
            --mitiru-bg:        #c8c8c8;
            --mitiru-surface:   #d8d8d8;
            --mitiru-surface-2: #c0c0c0;
            --mitiru-text:      #101010;
            --mitiru-text-mute: #4a4a4a;
            --mitiru-accent:    #c8002c;
            --mitiru-accent-hi: #a30022;
            --mitiru-success:   #4a4a4a;
            --mitiru-danger:    #c8002c;
            --mitiru-border:    #101010;
            --mitiru-border-soft: rgba(16, 16, 16, 0.30);
            --mitiru-font-body: "Arial Narrow", "Helvetica Neue Condensed",
                                "Courier New", "MS Gothic", ui-monospace, monospace;
            --mitiru-font-display: "Press Start 2P", "Arial Narrow",
                                   "Helvetica Neue Condensed", "Courier New", monospace;
            --mitiru-font-prose: "Arial Narrow", "Helvetica Neue Condensed",
                                 "MS Gothic", system-ui, sans-serif;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: var(--mitiru-bg);
            color: var(--mitiru-text);
            font-family: var(--mitiru-font-body);
            font-size: 13px;
            line-height: 1.45;
            font-variant-numeric: tabular-nums;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 14px;
            padding: 14px 18px 18px;
            box-sizing: border-box;
        }

        /* ── Header ──────────────────────────────────────────── */
        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--mitiru-border);
        }
        header h1 {
            margin: 0;
            font-family: var(--mitiru-font-display);
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.02em;
        }
        header h1 .accent { color: var(--mitiru-accent); }
        header .tag {
            font-size: 11px;
            font-weight: 500;
            color: var(--mitiru-text-mute);
        }

        /* ── Main grid ──────────────────────────────────────── */
        main {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
            gap: 14px;
            min-height: 0;
        }
        @media (max-width: 720px) {
            main { grid-template-columns: 1fr; }
        }

        .section {
            background: var(--mitiru-surface);
            border: 1px solid var(--mitiru-border);
            border-radius: 0;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            box-shadow: inset 2px 2px 0 #ffffff, inset -2px -2px 0 #6a6a6a;
        }

        /* Section caption: "── PROJECTS ───────── (2)"  */
        .section h2 {
            margin: 0 0 12px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--mitiru-text-mute);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .section h2::before { content: "──"; color: var(--mitiru-border); }
        .section h2::after  {
            content: "";
            flex: 1;
            border-bottom: 1px solid var(--mitiru-border);
            margin-left: 4px;
        }
        .section h2 .count {
            font-weight: 400;
            color: var(--mitiru-text-mute);
            margin-left: 4px;
        }

        .section .scroll {
            overflow-y: auto;
            margin: -4px;
            padding: 4px;
            flex: 1;
        }
        .section .scroll::-webkit-scrollbar { width: 6px; }
        .section .scroll::-webkit-scrollbar-thumb {
            background: var(--mitiru-border);
            border-radius: 3px;
        }

        /* ── Project rows ──────────────────────────────────── */
        .project {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 6px 12px;
            align-items: center;
            padding: 8px 12px;
            border-radius: 0;
            background: transparent;
            margin-bottom: 4px;
            border: 1px solid transparent;
            border-left: 2px solid transparent;
            transition: background 100ms, border-color 100ms;
        }
        .project:hover {
            background: var(--mitiru-surface-2);
            border-left-color: var(--mitiru-accent);
        }
        @media (max-width: 600px) {
            .project { grid-template-columns: 1fr; }
            .project__actions { justify-content: flex-start; }
        }

        .project__meta { min-width: 0; }
        .project__name {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0;
        }
        .project__name .running-pill {
            margin-left: 8px;
            display: inline-block;
            padding: 0 7px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.06em;
            border-radius: 9999px;
            vertical-align: middle;
            line-height: 1.4;
        }
        .project__name .running-pill.run   {
            background: var(--mitiru-accent);
            color: #ffffff;
        }
        .project__name .running-pill.watch {
            background: var(--mitiru-accent);
            color: #ffffff;
        }
        .project__path {
            font-size: 11px;
            color: var(--mitiru-text-mute);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .project__actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        button.action {
            font-family: inherit;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0;
            padding: 5px 12px;
            border-radius: 0;
            border: 1px solid var(--mitiru-border);
            background: var(--mitiru-surface);
            color: var(--mitiru-text);
            cursor: pointer;
            transition: background 100ms;
            box-shadow: inset 2px 2px 0 #ffffff, inset -2px -2px 0 #6a6a6a;
        }
        button.action:hover  { background: var(--mitiru-surface-2); }
        button.action:active {
            box-shadow: inset -2px -2px 0 #ffffff, inset 2px 2px 0 #6a6a6a;
        }
        button.action.icon   { padding: 4px 7px; font-size: 12px; }

        button.action.open {
            color: #ffffff;
            border-color: var(--mitiru-border);
            background: var(--mitiru-accent);
            font-weight: 600;
            padding: 6px 14px;
            box-shadow: inset 2px 2px 0 rgba(255,255,255,0.45),
                        inset -2px -2px 0 rgba(0,0,0,0.45);
        }
        button.action.open:hover  { background: var(--mitiru-accent-hi); }

        button.action.danger {
            color: var(--mitiru-danger);
            border-color: var(--mitiru-border);
        }
        button.action.danger:hover { background: rgba(200, 0, 44, 0.10); }

        button.action[disabled],
        button.action[disabled]:hover {
            opacity: 0.32;
            cursor: not-allowed;
            background: var(--mitiru-surface);
        }

        .empty {
            padding: 20px 14px;
            text-align: center;
            color: var(--mitiru-text-mute);
            font-size: 12px;
        }
        .empty .hint {
            display: block;
            margin-top: 4px;
            font-size: 11px;
            color: var(--mitiru-text-mute);
            opacity: 0.7;
        }

        .add-zone {
            margin-top: 8px;
            padding: 10px;
            border: 1px dashed var(--mitiru-border);
            border-radius: 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        button.add {
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 0;
            border: 1px solid var(--mitiru-border);
            background: var(--mitiru-accent);
            color: #ffffff;
            cursor: pointer;
            transition: background 100ms;
            box-shadow: inset 2px 2px 0 rgba(255,255,255,0.45),
                        inset -2px -2px 0 rgba(0,0,0,0.45);
        }
        button.add:hover { background: var(--mitiru-accent-hi); }
        button.add.secondary {
            border-color: var(--mitiru-border);
            background: var(--mitiru-surface);
            color: var(--mitiru-text);
            box-shadow: inset 2px 2px 0 #ffffff, inset -2px -2px 0 #6a6a6a;
        }
        button.add.secondary:hover { background: var(--mitiru-surface-2); }
        button.add[disabled] {
            opacity: 0.32; cursor: not-allowed;
            background: var(--mitiru-surface);
            border-color: var(--mitiru-border); color: var(--mitiru-text-mute);
        }

        /* ── Flash toast ──────────────────────────────────── */
        .flash {
            position: fixed; left: 18px; right: 18px; bottom: 14px;
            padding: 8px 14px; border-radius: 0;
            font-size: 12px; text-align: center;
            background: var(--mitiru-surface);
            border: 1px solid var(--mitiru-border);
            border-left-width: 3px;
            opacity: 0; transform: translateY(6px);
            transition: opacity 200ms, transform 200ms;
            pointer-events: none;
            box-shadow: inset 2px 2px 0 #ffffff, inset -2px -2px 0 #6a6a6a;
        }
        .flash.is-visible { opacity: 1; transform: translateY(0); }
        .flash.kind-ok    { color: var(--mitiru-text);    border-left-color: var(--mitiru-text); }
        .flash.kind-error { color: var(--mitiru-danger);  border-left-color: var(--mitiru-danger); }
        .flash.kind-info  { color: var(--mitiru-accent);  border-left-color: var(--mitiru-accent); }

        /* ── Modal (mitiru_modal.js runtime のクラスに Saturn を着せる) ── */
        .mitiru-modal-root {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .mitiru-modal-backdrop {
            position: absolute; inset: 0;
            background: rgba(200, 200, 200, 0.78);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .mitiru-modal {
            position: relative; z-index: 1;
            background: var(--mitiru-surface);
            padding: 20px 22px;
            border: 1px solid var(--mitiru-border);
            border-radius: 0;
            width: min(480px, calc(100vw - 64px));
            box-shadow: inset 3px 3px 0 #ffffff, inset -3px -3px 0 #6a6a6a,
                        0 6px 0 rgba(0, 0, 0, 0.18);
        }
        .mitiru-modal__close {
            position: absolute; top: 8px; right: 10px;
            border: 0; background: transparent;
            font-size: 18px; line-height: 1;
            color: var(--mitiru-text-mute); cursor: pointer;
        }
        .mitiru-modal__title {
            margin: 0 0 10px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        .mitiru-modal__body {
            font-size: 18px;
            color: var(--mitiru-text-mute);
            margin-bottom: 14px;
            line-height: 1.5;
            font-family: var(--mitiru-font-prose);
        }
        .mitiru-modal__body:empty { display: none; }
        .mitiru-modal__input {
            width: 100%; box-sizing: border-box;
            background: #ffffff;
            border: 1px solid var(--mitiru-border);
            border-radius: 0;
            padding: 10px 12px;
            margin-bottom: 14px;
            color: var(--mitiru-text);
            font-family: var(--mitiru-font-body);
            font-size: 18px;
            box-shadow: inset 2px 2px 0 #6a6a6a, inset -2px -2px 0 #ffffff;
        }
        .mitiru-modal__input:focus {
            outline: none;
            border-color: var(--mitiru-accent);
            box-shadow: inset 2px 2px 0 #6a6a6a, inset -2px -2px 0 #ffffff,
                        0 0 0 2px var(--mitiru-accent);
        }
        .mitiru-modal__actions {
            display: flex; justify-content: flex-end; gap: 8px;
        }
        .mitiru-modal__btn {
            font-family: inherit;
            font-size: 18px;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 0;
            border: 1px solid var(--mitiru-border);
            background: var(--mitiru-surface);
            color: var(--mitiru-text);
            cursor: pointer;
            transition: background 100ms;
            box-shadow: inset 2px 2px 0 #ffffff, inset -2px -2px 0 #6a6a6a;
        }
        .mitiru-modal__btn:hover { background: var(--mitiru-surface-2); }
        .mitiru-modal__btn:active {
            box-shadow: inset -2px -2px 0 #ffffff, inset 2px 2px 0 #6a6a6a;
        }
        .mitiru-modal__btn--ok {
            color: #ffffff;
            border-color: var(--mitiru-border);
            background: var(--mitiru-accent);
            font-weight: 600;
            box-shadow: inset 2px 2px 0 rgba(255,255,255,0.45),
                        inset -2px -2px 0 rgba(0,0,0,0.45);
        }
        .mitiru-modal__btn--ok:hover { background: var(--mitiru-accent-hi); }

        /* ── Recent runs ──────────────────────────────────── */
        .recent {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 0;
            background: transparent;
            margin-bottom: 3px;
            font-size: 12px;
            border-left: 2px solid transparent;
        }
        .recent:hover { background: var(--mitiru-surface-2); }
        .recent__name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .recent__name .mode {
            margin-left: 4px;
            font-size: 10px;
            color: var(--mitiru-text-mute);
        }
        .recent__status {
            flex-shrink: 0;
            font-size: 11px;
            color: var(--mitiru-text-mute);
        }
        .recent__status.ok  { color: var(--mitiru-text); }
        .recent__status.bad { color: var(--mitiru-danger); }
        .recent__time {
            flex-shrink: 0;
            color: var(--mitiru-text-mute);
            font-size: 11px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <header>
        <h1>Mitiru<span class="accent">Engine</span> &mdash; Launcher</h1>
        <span class="tag">v0.2.0</span>
    </header>

    <main>
        <section class="section section--projects">
            <h2>Projects <span class="count"
                data-m-tpl="({view.launcher.projects.length:int})">(0)</span></h2>
            <div class="scroll">
                <div class="empty" data-m-show="!view.launcher.projects.length">no projects yet
                    <span class="hint">add a game DLL with the button below</span></div>
                <div data-m-repeat="view.launcher.projects">
                    <template>
                        <div class="project">
                            <div class="project__meta">
                                <div class="project__name"><span data-m-text="name"></span><span
                                    class="running-pill watch"
                                    data-m-show="runningRun | runningWatch">LIVE</span></div>
                                <div class="project__path" data-m-text="dllPath"
                                     data-m-attr="title: {dllPath}"></div>
                            </div>
                            <div class="project__actions">
                                <button class="action open"
                                    data-m-action="launcher.open"
                                    data-m-payload='{"index":{index}}'
                                    title="Launch the game with hot reload + attach the dev companion bar">▶ Open</button>
                                <button class="action icon"
                                    data-m-action="launcher.open_folder"
                                    data-m-payload='{"index":{index}}'
                                    title="Open project folder in Explorer">📁</button>
                                <button class="action icon danger"
                                    data-m-action="launcher.remove_project"
                                    data-m-payload='{"index":{index}}'
                                    data-m-confirm-title="Remove from list?"
                                    data-m-confirm="The DLL file stays on disk — only the launcher entry is removed."
                                    title="Remove from this list (DLL file stays on disk)">✕</button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
            <div class="add-zone">
                <button class="add" disabled
                    data-m-action="launcher.scaffold"
                    data-m-enabled="view.launcher.env.canScaffold"
                    data-m-prompt="New project"
                    data-m-prompt-message="Letters, digits, underscore. Becomes the CMake target name and source dir under examples/."
                    data-m-prompt-default="my_game"
                    data-m-prompt-pattern="^[a-zA-Z_][a-zA-Z0-9_]*$"
                    data-m-payload='{"name":{$value}}'
                    title="Scaffold a new project under examples/ (engine source required)">+ New project</button>
                <button class="add secondary"
                    data-m-action="launcher.add_project"
                    data-m-payload="{}"
                    title="Register an already-built DLL">+ Add existing .dll</button>
            </div>
        </section>

        <section class="section section--recents">
            <h2>Recent runs</h2>
            <div class="scroll">
                <div class="empty" data-m-show="!view.launcher.recents.length">no runs yet</div>
                <div data-m-repeat="view.launcher.recents">
                    <template>
                        <div class="recent">
                            <div class="recent__name"><span data-m-text="projectName"></span><span
                                class="mode" data-m-show="watching">[watch]</span><span
                                class="mode" data-m-hide="watching">[run]</span></div>
                            <div class="recent__status" data-m-tpl="exit {exitCode}"
                                 data-m-class="ok: exitCode == 0; bad: exitCode != 0"></div>
                            <div class="recent__time" data-m-text="endedAt" data-m-format="ago"></div>
                        </div>
                    </template>
                </div>
            </div>
        </section>
    </main>

    <div class="flash" data-m-toast="view.launcher.flash" data-m-toast-ms="5500"></div>

    <script src="mitiru_runtime/mitiru_cef_state.js"></script>
    <script src="mitiru_runtime/mitiru_modal.js"></script>
    <script src="mitiru_runtime/mitiru_bind.js"></script>
</body>
</html>
